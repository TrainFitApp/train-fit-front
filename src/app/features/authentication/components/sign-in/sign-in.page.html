<ion-content class="auth-content flex-center">
  <div class="auth-container flex flex-center">
    <!-- Logo Section -->
    <div class="logo-section">
      <img
        class="logo-image"
        alt="Logo de TrainFit"
        src="../../../../../assets/img/logo/login_dark.svg"
      />
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form flex">
      <!-- Loading State -->
      <div *ngIf="loading" class="loading-container flex flex-center">
        <ion-spinner name="dots" color="primary"></ion-spinner>
        <p class="loading-text m-0">Verificando credenciales...</p>
      </div>

      <!-- Form Fields -->
      <div *ngIf="!loading" class="form-fields flex">
        <div class="input-group">
          <div class="input-wrapper flex-center-v">
            <ion-icon
              name="mail-outline"
              class="input-icon flex-center"
            ></ion-icon>
            <input
              type="email"
              placeholder="Correo electrónico"
              formControlName="email"
              class="input-field"
            />
          </div>
          <div
            *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
            class="validation-error"
          >
            <span *ngIf="loginForm.get('email')?.errors?.['required']"
              >El correo electrónico es obligatorio</span
            >
            <span *ngIf="loginForm.get('email')?.errors?.['email']"
              >Correo electrónico válido</span
            >
          </div>
        </div>

        <div class="input-group">
          <div class="input-wrapper flex-center-v">
            <ion-icon
              name="lock-closed-outline"
              class="input-icon flex-center"
            ></ion-icon>
            <input
              [type]="showPass ? 'text' : 'password'"
              placeholder="Contraseña"
              formControlName="password"
              class="input-field"
            />
            <ion-button
              fill="clear"
              class="password-toggle"
              (click)="showPass = !showPass"
              type="button"
            >
              <ion-icon
                [name]="showPass ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </ion-button>
          </div>
          <div
            *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            class="validation-error"
          >
            <span *ngIf="loginForm.get('password')?.errors?.['required']"
              >La contraseña es obligatoria</span
            >
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']"
              >La contraseña debe tener al menos 6 caracteres</span
            >
          </div>
        </div>

        <div class="forgot-password-container">
          <a class="forgot-password" (click)="goToRestorePass()"
            >¿Olvidaste tu contraseña?</a
          >
        </div>

        <!-- Login Button -->
        <ion-button
          type="submit"
          expand="block"
          class="login-button"
          [disabled]="!loginForm.valid"
        >
          Iniciar sesión
        </ion-button>

        <div class="divider">O accede con</div>

        <div class="social-login flex-column">
          <!-- Botón de Google: Visible en Android y iOS -->
          <button
            *ngIf="isAndroid || isApple"
            class="social-signin-button google"
            (click)="signInWithGoogle()"
            type="button"
          >
            <div class="social-logo">
              <svg width="20" height="20" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
            </div>
            <span class="button-text">Continuar con Google</span>
          </button>

          <!-- Botón de Apple: SOLO visible en iOS -->
          <button
            *ngIf="isApple"
            class="social-signin-button apple"
            (click)="signInWithApple()"
            type="button"
          >
            <div class="social-logo">
              <svg width="20" height="20" viewBox="0 0 226 226">
                <path
                  d="M170.18,91.8c-0.25,29.35,24.01,43.46,25.06,44.1c-0.12,0.4 -3.93,13.43 -12.92,26.54c-7.77,11.33 -15.84,22.61 -28.46,22.84c-12.4,0.23 -16.4,-7.34 -30.56,-7.34c-14.16,0 -18.6,7.11 -30.56,7.57c-12.18,0.47 -21.43-12.31 -29.28-23.64c-16.05-23.18 -28.32-65.5 -11.75-94.13c8.23-14.22,22.87-23.23,38.86-23.47c12.18-0.23,23.68,8.2,31.14,8.2c7.46,0,21.37-10.27,35.91-8.77c6.09,0.25,23.18,2.44,34.19,18.52C190.96,65.37,170.47,73.49,170.18,91.8z M138.83,38.03c6.51-7.88,10.89-18.82,9.69-29.74c-9.39,0.38-20.75,6.26-27.48,14.14c-6.03,6.96-11.31,18.15-9.88,28.8C121.57,51.98,132.32,45.9,138.83,38.03z"
                  fill="#ffffff"
                />
              </svg>
            </div>
            <span class="button-text">Continuar con Apple</span>
          </button>
        </div>

        <p class="signup-link">
          ¿Aún no tienes cuenta? <a (click)="navigateSignUp()">Crear cuenta</a>
        </p>
      </div>
    </form>
  </div>
</ion-content>
