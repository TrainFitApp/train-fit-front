<div
  class="numeric-input-wrapper"
  [ngClass]="{ completed: isDone }"
  [@shimmerAnimation]="shimmerAnimationState"
  [class.shimmer-run]="shimmerAnimationState === 'animate'"
>
  <span class="input-label">{{ label }}</span>
  <input
    type="text"
    inputmode="none"
    class="numeric-value-input"
    [attr.maxlength]="maxLength"
    [value]="displayValue"
    (focus)="onInputFocus($event)"
    (blur)="onInputBlur()"
    (input)="onInputChange($event)"
    (click)="onInputClick()"
    [placeholder]="placeholder || '-'"
  />
</div>
