<button type="button" class="premium-banner" (click)="pressed.emit()">
  <ion-icon name="diamond-outline" class="premium-banner__icon" aria-hidden="true"></ion-icon>
  <span class="premium-banner__text">
    <span class="premium-banner__title">{{ title }}</span>
    <span class="premium-banner__sub">{{ subtitle }}</span>
  </span>
  <ion-icon name="chevron-forward-outline" class="premium-banner__arrow" aria-hidden="true"></ion-icon>
</button>
