<ion-list>
  <ion-item
    *ngFor="let actionPopover of actionsPopover"
    [button]="true"
    [detail]="true"
    (click)="selectAction(actionPopover)"
  >
    <ion-label class="ion-text-wrap">
      <ion-icon
        [name]="actionPopover.icon"
        [color]="actionPopover.color"
      ></ion-icon>
      <strong>{{ actionPopover.value | uppercase }}</strong>
    </ion-label>
  </ion-item>
</ion-list>
