<div class="ai-loading-overlay" [class.hidden]="!visible">
  <div class="ai-loading-content">
    <div class="ai-loading-spinner">
      <div class="spinner-ring"></div>
      <ion-icon name="color-wand-outline" class="spinner-icon"></ion-icon>
    </div>
    <div class="ai-loading-title">TrainFit</div>
    <div class="ai-loading-message">{{ message }}</div>
    <div class="ai-loading-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="tip-carousel">
      <div class="tip-track" [class.fade-out]="animating">
        <ion-icon [name]="tips[currentTip].icon" class="tip-icon"></ion-icon>
        <div class="tip-text">{{ currentTipText }}</div>
      </div>
    </div>
  </div>
</div>
