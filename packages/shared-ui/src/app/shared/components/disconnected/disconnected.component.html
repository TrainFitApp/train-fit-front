<ion-content class="disconnected-screen" [fullscreen]="true">
  <section class="disconnected-card">
    <div class="disconnected-card__icon">
      <ion-icon name="wifi-outline"></ion-icon>
    </div>

    <p class="disconnected-card__eyebrow">{{ 'DISCONNECTED.EYEBROW' | translate }}</p>
    <h1>{{ 'DISCONNECTED.TITLE' | translate }}</h1>

    <p class="disconnected-card__message">
      {{ 'DISCONNECTED.MESSAGE' | translate }}
    </p>

    <div class="disconnected-card__status">
      <span>{{ 'DISCONNECTED.WAITING' | translate }}</span>
    </div>

    <ion-spinner name="crescent" color="primary" class="disconnected-card__spinner"></ion-spinner>
  </section>
</ion-content>
