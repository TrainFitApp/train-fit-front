<ion-header>
  <!-- Header personalizado -->
  <div class="weight-info-header">
    <div class="header-content">
      <div class="back-section">
        <button class="back-button" (click)="goBack()" aria-label="Volver">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
      </div>

      <div class="title-section">
        <h1 class="page-title">{{ monthYear }}</h1>
      </div>
    </div>

    <div class="progress-bar" [style.visibility]="load ? 'hidden' : 'visible'">
      <div class="progress-indicator"></div>
    </div></div
></ion-header>

<ion-content>
  <!-- Contenido principal -->
  <div class="weight-info-container">
    <!-- Calendario -->
    <div class="calendar-section">
      <app-calendar
        class="weight-calendar"
        [fetchOnInit]="true"
        (selectDate)="selectDate($event)"
        (monthYear)="setMonthYear($event)"
        (loading)="setLoading($event)"
      ></app-calendar>
    </div>

    <!-- Notas -->
    <div class="notes-section" *ngIf="currentNotes">
      <app-notes
        [notes]="currentNotes"
        [detail]="true"
        [canDelete]="false"
        [canModify]="false"
      ></app-notes>
    </div>

    <!-- Sección del gráfico -->
    <div class="chart-section">
      <!-- Selector de rango -->
      <div class="range-selector">
        <ion-segment
          class="range-segment"
          [value]="chartRange"
          (ionChange)="chartRangeChange($event)"
        >
          <ion-segment-button [value]="CHART_RANGES.week">
            <ion-label>Semanal</ion-label>
          </ion-segment-button>
          <ion-segment-button [value]="CHART_RANGES.month">
            <ion-label>Mensual</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>

      <!-- Información del peso -->
      <div class="weight-info-card">
        <div class="weight-current">
          <div class="weight-day">{{ days[getDayOfWeek(selectedDate)] }}</div>
          <div class="weight-value">
            {{ currentWeight ? currentWeight + ' Kg' : 'Sin registro' }}
          </div>
        </div>

        <div class="weight-stats">
          <div
            class="stat-item"
            *ngIf="chartRange === CHART_RANGES.week"
            style="color: #ffffff"
          >
            Semana {{ getWeekOfMonth() }}
          </div>
          <div class="stat-item" *ngIf="chartRange === CHART_RANGES.month">
            <span class="stat-label">Media mensual:</span>
            <span class="stat-value"
              >{{ average ? average + ' Kg' : 'Sin registros' }}</span
            >
          </div>
          <div class="stat-item" *ngIf="chartRange === CHART_RANGES.year">
            Media anual
          </div>
        </div>
      </div>

      <!-- Contenedor del gráfico -->
      <div class="chart-container">
        <canvas id="dayWeight"></canvas>
      </div>
    </div>
  </div>
</ion-content>
