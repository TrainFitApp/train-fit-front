<div
  class="splash-container"
  [class.is-leaving]="animationState === 'out'"
  [class.is-failed]="loadFailed"
>
  <!-- El propio logo hace de barra de progreso: una copia fantasma en gris
       y encima la de color, recortada en diagonal según `progress`. -->
  <div class="logo-stage" [style.--fill]="progress">
    <img class="logo-layer logo-ghost" src="../../../../assets/logo_light.png" alt="" />
    <img class="logo-layer logo-fill" src="../../../../assets/logo_light.png" alt="TrainFit" />

    <div
      class="progress-bar"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="progress"
    >
      <div class="progress-fill"></div>
    </div>

    <p class="loader-status" *ngIf="loadFailed" role="alert">{{ loadingText }}</p>
  </div>
</div>
