<div class="toolbar-calendar-container">
  <div class="main-toolbar">
    <div class="toolbar-content">
      <!-- Sección del título -->
      <div class="title-section" (click)="selectToday()">
        <div class="title-content">
          <span class="month-year" @fadeIn *ngIf="!load">{{ month }} {{ year }}</span>
          <strong class="brand-name" @fadeIn *ngIf="load">
            <span class="train-text">TRAIN</span><span class="fit-text">FIT</span>
          </strong>
        </div>
      </div>

      <!-- Sección de acciones -->
      <div class="actions-section">
        <!-- La lista sale de las fases de dieta que pauta el profesional: sin
             nutricionista activo no habría nada que comprar. A la izquierda
             para que el resto de botones no cambie de sitio. -->
        <ion-button mode="md" fill="clear" class="action-button shopping-button ripple-effect"
          *ngIf="coachService.hasNutritionCoach()" (click)="openShoppingList()"
          [attr.aria-label]="'COACH.SHOPPING_LIST' | translate">
          <ion-icon name="cart-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button mode="md" fill="clear" class="action-button macros-button ripple-effect" (click)="openMacrosOptions($event)"
          [attr.aria-label]="'TOOLBAR_CALENDAR.MACROS_OPTIONS_ARIA' | translate">
          <ion-icon name="ellipsis-horizontal-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button mode="md" fill="clear" class="action-button calendar-button ripple-effect" id="calendar-diets"
          [attr.aria-label]="'TOOLBAR_CALENDAR.CALENDAR_ARIA' | translate">
          <ion-icon name="calendar-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <ion-button mode="md" fill="clear" class="action-button pin-button ripple-effect" (click)="managePinnedNote()"
          *ngIf="pinnedNote" [attr.aria-label]="'TOOLBAR_CALENDAR.PINNED_NOTE_ARIA' | translate">
          <ion-icon name="pin" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>

  <!-- Slider de fechas -->
  <div class="dates-slider-container">
    <app-dates-slider (selectedDateEvent)="onDateSelected($event)"></app-dates-slider>
  </div>

  <!-- Barras de macros -->
  <div class="macros-container">
    <app-macros-bars></app-macros-bars>
  </div>
</div>
