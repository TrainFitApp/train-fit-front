<swiper-container class="t-dates-slider" #dateSlides>
  <swiper-slide *ngFor="let slide of allDateSlides; let s = index">
    <!-- Línea fina por FASE encima de los días, con su
         nombre; corta donde empieza la siguiente. -->
    <div class="phase-line" *ngIf="segmentsBySlide[s]?.length">
      <div
        class="phase-line__segment"
        *ngFor="let seg of segmentsBySlide[s]"
        [style.flex]="seg.span"
        [class.is-empty]="!seg.color"
        [style.--phase-color]="seg.color"
      >
        <span class="phase-line__name" *ngIf="seg.color">{{ seg.name }}</span>
        <span class="phase-line__bar"></span>
      </div>
    </div>
    <ion-grid>
      <ion-row>
        <ion-col
          *ngFor="let day of slide"
          (click)="sendSelectedDate(day)"
          [class.selected]="datesAreOnSameDay(currentDate, day)"
          [class.today]="today.getDate() === day.getDate() && today.getMonth() === day.getMonth()"
          [class.has-revision]="!!infoFor(day)"
          [style.--revision-color]="infoFor(day)?.revisionColor"
        >
          <!-- En qué revisión cae el día, en pequeño arriba a la derecha. -->
          <span class="revision-badge" *ngIf="infoFor(day) as info">R{{ info.revisionNumber }}</span>
          <div>{{ day | date : "dd" }}</div>
          <div>{{ getDayAbbreviation(day) }}</div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </swiper-slide>
</swiper-container>
