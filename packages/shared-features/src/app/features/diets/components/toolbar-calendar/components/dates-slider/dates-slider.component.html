<swiper-container class="t-dates-slider" #dateSlides>
  <swiper-slide *ngFor="let slide of allDateSlides; let s = index; trackBy: trackBySlide">
    <!-- Línea fina por FASE encima de los días, con su nombre y en qué
         semana de ella va; corta donde empieza la siguiente. La semana se
         dice aquí y no día a día: la tira ENTERA es una semana. -->
    <div class="phase-line" *ngIf="segmentsBySlide[s]?.length">
      <div
        class="phase-line__segment"
        *ngFor="let seg of segmentsBySlide[s]"
        [style.flex]="seg.span"
        [class.is-empty]="!seg.color"
        [style.--phase-color]="seg.color"
      >
        <span class="phase-line__name" *ngIf="seg.color">
          {{ seg.name }}
          <span class="phase-line__week" *ngIf="seg.weekNumber">· {{ 'COACH.WEEK_N' | translate: { n: seg.weekNumber } }}</span>
        </span>
        <span class="phase-line__bar"></span>
      </div>
    </div>
    <ion-grid>
      <ion-row>
        <ion-col
          *ngFor="let day of slide; trackBy: trackByDay"
          (click)="sendSelectedDate(day)"
          [class.selected]="datesAreOnSameDay(currentDate, day)"
          [class.today]="today.getDate() === day.getDate() && today.getMonth() === day.getMonth()"
          [class.has-week]="!!infoFor(day)"
          [style.--week-color]="infoFor(day)?.phaseColor"
        >
          <div>{{ day | date : "dd" }}</div>
          <div>{{ getDayAbbreviation(day) }}</div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </swiper-slide>
</swiper-container>
