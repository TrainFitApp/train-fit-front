<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()" aria-label="Cerrar">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ preview.name }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="menu-preview">
  <p class="menu-preview__hint">
    {{ isSelected ? 'Este es el menú que tienes elegido hoy.' : 'Así es este menú. Si lo eliges, sus comidas pasan a ser las de hoy.' }}
  </p>

  <section class="menu-preview__meal" *ngFor="let meal of nonEmptyMeals">
    <h3 class="menu-preview__meal-name">{{ meal.name }}</h3>
    <ul class="menu-preview__items">
      <li *ngFor="let item of meal.items">
        <span class="menu-preview__item-name">{{ item.name }}</span>
        <span class="menu-preview__item-qty" *ngIf="item.quantity !== null">{{ item.quantity }} {{ item.unit }}</span>
      </li>
    </ul>
  </section>

  <p class="menu-preview__empty" *ngIf="!nonEmptyMeals.length">Este menú no tiene comidas pautadas.</p>
</ion-content>

<ion-footer class="ion-no-border" *ngIf="!isSelected">
  <div class="menu-preview__footer">
    <ion-button expand="block" class="menu-preview__choose" (click)="choose()">Elegir este menú</ion-button>
  </div>
</ion-footer>
