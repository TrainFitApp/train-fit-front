<div class="daily-weight-container">
  <div class="weight-card">
    <div class="weight-row">
      <form [formGroup]="weightForm" class="weight-form">
        <div class="input-wrapper">
          <span class="input-prefix">PESO DIARIO</span>
          <ion-input
            #inputWeight
            formControlName="weight"
            type="text" inputmode="decimal" appNumericKeypad
            class="weight-input"
            step="0.1"
            min="0"
            max="300"
            maxlength="6"
            appDecimalInput
          ></ion-input>
          <span class="input-unit">Kg</span>
        </div>
        <button
          class="save-button"
          [class.saving]="!isLoad"
          [class.success]="showSuccess"
          [class.disabled]="!weightForm?.get('weight')?.value || !isLoad"
          (click)="saveWeight()"
          type="button"
          aria-label="Guardar peso"
        >
          <ion-icon [name]="getCheckIconName()"></ion-icon>
        </button>
      </form>
      <button
        class="calendar-button"
        (click)="openWeightInfo(); $event.stopPropagation()"
        aria-label="Ver calendario de pesos"
      >
        <ion-icon name="stats-chart-outline"></ion-icon>
      </button>
    </div>

    <div class="progress-section" *ngIf="weightForm.get('weight')?.value">
      <div class="trend-indicator">
        <ion-icon name="trending-up-outline" class="trend-icon up" *ngIf="getTrend() === 'up'"></ion-icon>
        <ion-icon name="trending-down-outline" class="trend-icon down" *ngIf="getTrend() === 'down'"></ion-icon>
        <ion-icon name="remove-outline" class="trend-icon stable" *ngIf="getTrend() === 'stable'"></ion-icon>
        <span class="trend-text">{{ getTrendText() }}</span>
      </div>
      <button class="chart-toggle-button" (click)="toggleChart()" [class.active]="showChart">
        <ion-icon [name]="showChart ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
    </div>
  </div>

  <div class="chart-card" [class.hidden]="!showChart">
    <div class="chart-content">
      <canvas id="dailyWeight"></canvas>
    </div>
  </div>
</div>
