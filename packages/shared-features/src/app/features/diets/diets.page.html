<ion-header>
  <div class="fused-header-section">
    <app-toolbar-calendar
      [load]="load"
      [dietDay]="dietDay"
      [dietId]="user?.dietInUse"
      (selectCalendarDayEmit)="selectCalendarDay($event)"
      (pasteDietDayMode)="pasteDietDayMode = true"
      (pinnedNoteChange)="onPinnedNoteChange($event)"
    ></app-toolbar-calendar>
  </div>
</ion-header>

<ion-content #ionContent class="t-init-diets">
  <!-- Premium upgrade banner (solo free) -->
  <button
    class="premium-banner"
    *ngIf="!isPremiumActive"
    (click)="goToPremium()"
  >
    <ion-icon name="diamond-outline" class="premium-banner__icon"></ion-icon>
    <div class="premium-banner__text">
      <span class="premium-banner__title">Hazte Pro</span>
      <span class="premium-banner__sub"
        >Recetas ilimitadas, sin anuncios y más</span
      >
    </div>
    <ion-icon
      name="chevron-forward-outline"
      class="premium-banner__arrow"
    ></ion-icon>
  </button>

  <app-notes
    *ngIf="dietDay?.notes"
    [object]="dietDay"
    [notes]="dietDay.notes"
    [detail]="true"
  ></app-notes>

  <div class="pinned-note-container" *ngIf="pinnedNote">
    <div class="pinned-note-wrapper" (click)="editPinnedNote()">
      <div class="pinned-note-card">
        <div class="card-header">
          <div class="left-section">
            <div class="icon-wrapper">
              <ion-icon name="pin"></ion-icon>
            </div>
            <div class="header-row">
              <span class="title">{{ 'NOTES.PINNED_TO_POSITION' | translate }}</span>
            </div>
          </div>
          <div class="action-wrapper">
            <ion-button fill="clear" size="small" class="close-button" (click)="deletePinnedNote(); $event.stopPropagation()">
              <ion-icon name="close" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </div>
        <p class="text">{{ pinnedNote }}</p>
      </div>
    </div>
  </div>

  <ion-button
    *ngIf="pasteDietDayMode && !isPasting;"
    expand="block"
    class="paste-day-button ripple-effect"
    (click)="pasteDietDay()"
    ><strong>PEGAR DÍA</strong>
  </ion-button>

  <ion-grid class="t-diets-meals">
    <ion-accordion-group multiple="true">
      <app-meal
        *ngFor="let meal of dietDay?.meals; let j = index;"
        [meal]="meal"
        [dietDay]="dietDay"
        [mealIndex]="j"
        [user]="user"
        [load]="load"
        [pasteMode]="pasteMode"
        (pasteEvent)="paste($event)"
      ></app-meal>
    </ion-accordion-group>
  </ion-grid>

  <app-daily-weight
    [user]="user"
    [selectedDate]="selectedDate"
    (createdDietDay)="scrollBottom()"
    (scrollToBottom)="scrollBottom()"
  ></app-daily-weight>

  <ion-fab
    *ngIf="pasteMode || pasteDietDayMode"
    vertical="bottom"
    horizontal="end"
    slot="fixed"
  >
    <ion-fab-button (click)="pasteMode = false; pasteDietDayMode = false;">
      <ion-icon name="arrow-undo-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-popover trigger="calendar-diets">
    <ng-template>
      <ion-datetime
        first-day-of-week="1"
        #datetime
        [showDefaultButtons]="true"
        [doneText]="'COMMON.CONFIRM' | translate"
        [cancelText]="'COMMON.CANCEL' | translate"
        presentation="date"
        (ionChange)="selectCalendarDay(datetime.value.toString())"
      ></ion-datetime>
    </ng-template>
  </ion-popover>
</ion-content>
