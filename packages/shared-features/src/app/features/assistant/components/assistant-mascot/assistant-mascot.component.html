<svg
  viewBox="0 0 80 48"
  role="img"
  [attr.aria-label]="label || null"
  [attr.aria-hidden]="label ? null : 'true'"
  class="mascot"
  [ngClass]="'mascot--' + mood"
  [class.mascot--waving]="waving"
  xmlns="http://www.w3.org/2000/svg"
>
  <g class="mascot__body">
    <!-- Placas pequeñas de los extremos -->
    <rect class="mascot__plate-outer" x="2" y="10" width="8" height="28" rx="3" />
    <rect class="mascot__plate-outer" x="70" y="10" width="8" height="28" rx="3" />

    <!-- Placas grandes: su relleno naranja es la energía que le queda -->
    <rect class="mascot__plate" x="9" y="3" width="12" height="42" rx="4.5" />
    <rect class="mascot__plate" x="59" y="3" width="12" height="42" rx="4.5" />
    <rect class="mascot__charge" x="10.6" [attr.y]="chargeY" width="8.8" [attr.height]="chargeHeight" rx="3" />
    <rect class="mascot__charge" x="60.6" [attr.y]="chargeY" width="8.8" [attr.height]="chargeHeight" rx="3" />
    <rect class="mascot__shine" x="11.2" y="6.5" width="1.4" height="35" rx="0.7" />
    <rect class="mascot__shine" x="61.2" y="6.5" width="1.4" height="35" rx="0.7" />

    <!-- Topes -->
    <rect class="mascot__collar" x="21" y="15" width="4" height="18" rx="1.5" />
    <rect class="mascot__collar" x="55" y="15" width="4" height="18" rx="1.5" />

    <!-- La barra es la cara -->
    <rect class="mascot__bar" x="25" y="13" width="30" height="22" rx="11" />

    <ng-container [ngSwitch]="mood">
      <g *ngSwitchCase="'happy'" class="mascot__face">
        <path class="mascot__eye-arc" d="M31.6 23.6 Q34.5 19.4 37.4 23.6" />
        <path class="mascot__eye-arc" d="M42.6 23.6 Q45.5 19.4 48.4 23.6" />
        <path class="mascot__mouth-open" d="M36.4 27.3 Q40 28.3 43.6 27.3 Q42.9 32.6 40 32.6 Q37.1 32.6 36.4 27.3 Z" />
      </g>

      <g *ngSwitchCase="'asleep'" class="mascot__face">
        <path class="mascot__eye-arc" d="M31.8 23 Q34.5 25.6 37.2 23" />
        <path class="mascot__eye-arc" d="M42.8 23 Q45.5 25.6 48.2 23" />
        <path class="mascot__mouth" d="M38.4 29.6 L41.6 29.6" />
      </g>

      <g *ngSwitchCase="'thinking'" class="mascot__face">
        <g class="mascot__eyes">
          <ellipse class="mascot__eye" cx="34.5" cy="22.6" rx="3.4" ry="4" />
          <ellipse class="mascot__eye" cx="45.5" cy="22.6" rx="3.4" ry="4" />
          <circle class="mascot__pupil" cx="35.6" cy="21" r="1.8" />
          <circle class="mascot__pupil" cx="46.6" cy="21" r="1.8" />
        </g>
        <circle class="mascot__mouth-dot" cx="40" cy="29.4" r="1.3" />
      </g>

      <g *ngSwitchCase="'tired'" class="mascot__face">
        <g class="mascot__eyes">
          <ellipse class="mascot__eye" cx="34.5" cy="23.6" rx="3.4" ry="2.1" />
          <ellipse class="mascot__eye" cx="45.5" cy="23.6" rx="3.4" ry="2.1" />
          <circle class="mascot__pupil" cx="34.5" cy="24" r="1.4" />
          <circle class="mascot__pupil" cx="45.5" cy="24" r="1.4" />
        </g>
        <path class="mascot__mouth" d="M37.6 29.6 L42.4 29.6" />
        <path class="mascot__drop" d="M51.5 11.5 Q53.6 14.6 53.6 15.8 A2.1 2.1 0 0 1 49.4 15.8 Q49.4 14.6 51.5 11.5 Z" />
      </g>

      <g *ngSwitchDefault class="mascot__face">
        <g class="mascot__eyes">
          <ellipse class="mascot__eye" cx="34.5" cy="22.6" rx="3.4" ry="4" />
          <ellipse class="mascot__eye" cx="45.5" cy="22.6" rx="3.4" ry="4" />
          <circle class="mascot__pupil" cx="34.8" cy="23.4" r="1.9" />
          <circle class="mascot__pupil" cx="45.8" cy="23.4" r="1.9" />
          <circle class="mascot__glint" cx="34" cy="22.5" r="0.6" />
          <circle class="mascot__glint" cx="45" cy="22.5" r="0.6" />
        </g>
        <path class="mascot__mouth" d="M37 28.4 Q40 31.4 43 28.4" />
      </g>
    </ng-container>
  </g>

  <g *ngIf="mood === 'asleep'" class="mascot__zzz">
    <path class="mascot__z" d="M60 9.5 h3.4 l-3.4 3.4 h3.4" />
    <path class="mascot__z mascot__z--late" d="M65.5 3.5 h2.6 l-2.6 2.6 h2.6" />
  </g>
</svg>
