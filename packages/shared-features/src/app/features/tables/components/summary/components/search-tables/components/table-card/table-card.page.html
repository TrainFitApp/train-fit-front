<ion-card
  class="professional-table-card"
  [class.selected]="user?.tableInUse === tableCard._id"
  (click)="setSelectedTableCard()"
>
  <div class="card-overlay">
    <header class="routine-header">
      <div class="routine-heading">
        <span *ngIf="routineType" class="routine-type">{{ routineType }}</span>
        <h2 class="card-title">{{ tableCard?.name }}</h2>
      </div>

      <button
        *ngIf="ownFilter"
        class="action-btn menu-btn"
        aria-label="Opciones de la rutina"
        (click)="openMenu($event)"
      >
        <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      </button>
    </header>

    <div *ngIf="tableCard" class="routine-content">
      <div *ngIf="own" class="active-status">
        <span class="active-dot"></span>
        <span>RUTINA ACTIVA</span>
      </div>

      <div class="routine-meta" aria-label="Resumen de la rutina">
        <span class="meta-chip meta-chip-primary">
          {{ microcyclesCount }} {{ microcyclesCount === 1 ? 'microciclo' :
          'microciclos' }}
        </span>
        <span class="meta-chip">
          {{ workoutsCount }} {{ workoutsCount === 1 ? 'entrenamiento' :
          'entrenamientos' }}
        </span>
      </div>

      <section *ngIf="workoutNames.length > 0" class="routine-schedule">
        <button
          class="schedule-trigger"
          type="button"
          [attr.aria-expanded]="scheduleExpanded"
          (click)="toggleSchedule($event)"
        >
          <span>Distribución del microciclo</span>
          <ion-icon
            [name]="scheduleExpanded ? 'chevron-up-outline' : 'chevron-down-outline'"
          ></ion-icon>
        </button>
        <div
          *ngIf="scheduleExpanded"
          class="schedule-chips schedule-chips-expanded"
        >
          <span *ngFor="let workoutName of workoutNames" class="schedule-chip">
            {{ workoutName }}
          </span>
        </div>
      </section>
    </div>

    <footer *ngIf="!own" class="routine-actions">
      <button
        *ngIf="loadAction; else loadingAction"
        class="primary-action-btn"
        (click)="useTable(); $event.stopPropagation()"
      >
        <ion-icon
          [name]="ownFilter ? 'play-outline' : 'add-outline'"
          class="action-icon"
        ></ion-icon>
        <span>{{ ownFilter ? 'SELECCIONAR RUTINA' : 'ADQUIRIR RUTINA' }}</span>
      </button>

      <ng-template #loadingAction>
        <div class="loading-action" aria-label="Procesando rutina">
          <ion-progress-bar
            type="indeterminate"
            color="primary"
          ></ion-progress-bar>
        </div>
      </ng-template>
    </footer>
  </div>

  <ion-popover
    [isOpen]="isMenuOpen"
    [event]="menuEvent"
    (didDismiss)="onMenuDidDismiss()"
    mode="ios"
  >
    <ng-template>
      <ion-list>
        <ion-item [button]="true" [detail]="true" (click)="editTableName()">
          <ion-icon
            name="pencil-outline"
            color="alternative"
            slot="start"
          ></ion-icon>
          <ion-label class="ion-text-wrap"><strong>NOMBRE</strong></ion-label>
        </ion-item>
        <ion-item
          [button]="true"
          [detail]="true"
          (click)="copyOwnTable(tableCard._id, $event)"
        >
          <ion-icon
            name="duplicate-outline"
            color="secondary"
            slot="start"
          ></ion-icon>
          <ion-label class="ion-text-wrap"><strong>DUPLICAR</strong></ion-label>
        </ion-item>
        <ion-item
          [button]="true"
          [detail]="true"
          (click)="deleteTable(tableCard._id, $event)"
        >
          <ion-icon
            name="trash-bin-outline"
            color="danger"
            slot="start"
          ></ion-icon>
          <ion-label class="ion-text-wrap"><strong>ELIMINAR</strong></ion-label>
        </ion-item>
      </ion-list>
    </ng-template>
  </ion-popover>
</ion-card>
