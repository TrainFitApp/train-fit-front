<div class="heatmap-card" *ngIf="hasData">
  <div class="heatmap-title">
    <span>{{ 'TABLES.SETS_HEATMAP_TITLE' | translate }}</span>
    <app-glossary-info term="SESSION_ACTIVITY" size="sm"></app-glossary-info>
  </div>

  <div class="heatmap-scroll">
    <div class="heatmap-grid">
      <span class="heatmap-axis-label">{{ 'TABLES.SETS_HEATMAP_AXIS' | translate }}</span>

      <div class="heatmap-column" *ngFor="let column of columns">
        <span class="heatmap-column-label">{{ column.splitLabel }}</span>
        <span
          class="heatmap-cell"
          *ngFor="let cell of column.cells"
          [class.is-empty]="cell.isRest"
          [attr.data-level]="cell.level"
          (click)="showCellInfo($event, cell)"
        ></span>
      </div>
    </div>
  </div>

  <div class="heatmap-footer">
    <div class="heatmap-legend">
      <span class="heatmap-legend-label">{{ 'TABLES.SETS_HEATMAP_LESS' | translate }}</span>
      <span class="heatmap-cell" data-level="0"></span>
      <span class="heatmap-cell" data-level="1"></span>
      <span class="heatmap-cell" data-level="2"></span>
      <span class="heatmap-cell" data-level="3"></span>
      <span class="heatmap-cell" data-level="4"></span>
      <span class="heatmap-legend-label">{{ 'TABLES.SETS_HEATMAP_MORE' | translate }}</span>
    </div>
  </div>
</div>
