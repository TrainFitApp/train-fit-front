<ion-header class="filter-header">
  <div class="filter-toolbar">
    <div class="header-content">
      <div class="title-section">
        <ion-title class="filter-title"
          >{{ 'ORDER_EXERCISES.TITLE' | translate }}</ion-title
        >
      </div>
      <ion-buttons slot="end">
        <button
          class="close-action-button ripple-effect"
          (click)="refreshOrder()"
        >
          <ion-icon name="refresh-outline"></ion-icon>
        </button>
        <button
          class="close-action-button ripple-effect"
          (click)="dismissModal()"
        >
          <ion-icon name="close" color="primary"></ion-icon>
        </button>
      </ion-buttons>
    </div>
  </div>
  <ion-progress-bar *ngIf="loading" type="indeterminate"></ion-progress-bar>
</ion-header>

<ion-content class="content-modern">
  <div class="container-elegant">
    <!-- Warning Message -->
    <div class="warning-section">
      <ion-icon name="swap-vertical" class="warning-icon"></ion-icon>
      <p class="warning-text">
        {{ (hasBlocks ? 'ORDER_EXERCISES.HINT_BLOCKS' : 'ORDER_EXERCISES.HINT') | translate }}
      </p>
    </div>

    <!-- Exercise List: ejercicios sueltos y bloques enteros -->
    <app-exercise-order-list
      [workout]="orderSource"
      [disabled]="loading"
      (orderChange)="onOrderChange($event)"
    ></app-exercise-order-list>
  </div>
</ion-content>

<ion-footer
  ><!-- Action Button -->
  <div class="action-section">
    <ion-button
      *ngIf="!loading"
      expand="block"
      (click)="dismissModal()"
      class="save-button-elegant"
      fill="solid"
    >
      {{ 'ORDER_EXERCISES.SAVE' | translate }}
    </ion-button>
  </div></ion-footer
>
