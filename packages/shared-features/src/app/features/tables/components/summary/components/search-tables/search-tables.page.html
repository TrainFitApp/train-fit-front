<ion-header class="modern-search-header">
  <div class="tf-page-header">
    <div class="tf-page-header__content">
      <div class="tf-page-header__back-section">
        <button
          class="tf-page-header__back-button"
          aria-label="Volver"
          (click)="close()"
        >
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
      </div>
      <div class="tf-page-header__title-section">
        <h1 class="tf-page-header__title">Buscar rutinas</h1>
      </div>
      <div class="tf-page-header__actions"></div>
    </div>
  </div>
</ion-header>

<ion-content class="search-tables-content">
  <ng-container *ngIf="load; else notLoad">
    <ng-container *ngIf="tableList.length > 0; else noTables">
      <app-table-card
        *ngFor="let tableCard of tableList"
        [user]="user"
        [ownFilter]="searchFilterGroup.ownFilter"
        [own]="tableCard._id === user.tableInUse"
        [tableCard]="tableCard"
        (copyOwnTableEv)="copyOwnTable($event)"
        (deletedTable)="deleteTable($event)"
      ></app-table-card>
    </ng-container>

    <ng-template #noTables>
      <ion-item>
        <ion-label>No hay coincidencias</ion-label>
      </ion-item>
    </ng-template>
  </ng-container>

  <ng-template #notLoad>
    <div class="skeleton-table-card" *ngFor="let i of [1, 2, 3]">
      <div class="skeleton-heading">
        <ion-skeleton-text
          [animated]="true"
          class="skeleton-title"
        ></ion-skeleton-text>
        <ion-skeleton-text
          *ngIf="searchFilterGroup.ownFilter"
          [animated]="true"
          class="skeleton-menu"
        ></ion-skeleton-text>
      </div>

      <div class="skeleton-chips">
        <ion-skeleton-text
          [animated]="true"
          class="skeleton-chip"
        ></ion-skeleton-text>
        <ion-skeleton-text
          [animated]="true"
          class="skeleton-chip skeleton-chip-wide"
        ></ion-skeleton-text>
      </div>

      <div class="skeleton-schedule">
        <ion-skeleton-text
          [animated]="true"
          class="skeleton-label"
        ></ion-skeleton-text>
        <div class="skeleton-chips">
          <ion-skeleton-text
            *ngFor="let day of [1, 2, 3]"
            [animated]="true"
            class="skeleton-day"
          ></ion-skeleton-text>
        </div>
      </div>

      <ion-skeleton-text
        *ngIf="!searchFilterGroup.ownFilter"
        [animated]="true"
        class="skeleton-action"
      ></ion-skeleton-text>
    </div>
  </ng-template>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
