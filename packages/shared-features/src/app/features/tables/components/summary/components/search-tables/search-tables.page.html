<ion-header class="minimal-header">
  <div class="search-header">
    <div class="header-content">
      <div class="back-section">
        <button class="back-button" (click)="close()">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
      </div>

      <div class="search-section">
        <ion-searchbar
          #searchbar
          (ionInput)="searchTables($event)"
          debounce="250"
          placeholder="{{ 'COMMON.SEARCH' | translate }}"
          mode="ios"
          animated
          class="custom-searchbar"
        ></ion-searchbar>
      </div>

      <div class="actions-section">
      </div>
    </div>

    <!-- Table filter icons for Todas / Mis Rutinas (copia exacta de search-exercises) -->
    <app-table-filter-icons
      *ngIf="user && user._id"
      (filterSelection)="onFilterModeChange($event)"
    >
    </app-table-filter-icons>
  </div>

</ion-header>

<ion-content class="exercises-content">
  <div class="exercises-list" *ngIf="tableList.length > 0; else emptyTables">
    <app-table-card
      *ngFor="let tableCard of tableList; let i = index"
      [user]="user"
      [ownFilter]="searchFilterGroup.ownFilter"
      [own]="tableCard._id === user.tableInUse"
      [tableCard]="tableCard"
      (duplicateTableEv)="duplicateTable($event)"
      (deletedTable)="deleteTable($event)"
    ></app-table-card>
  </div>

  <ng-template #emptyTables>
    <ng-container *ngIf="load">
      <div class="empty-state">
        <div class="empty-icon">
          <ion-icon name="search-outline"></ion-icon>
        </div>
        <h3 class="empty-title">{{ 'TABLES.NO_MATCHES' | translate }}</h3>
        <p class="empty-message">
          {{ 'TABLES.NO_MATCHES_MSG' | translate }}
        </p>
      </div>
    </ng-container>
  </ng-template>

  <div class="skeleton-container" *ngIf="!load">
    <app-skeleton-loader
      [rows]="2"
      [detailColumns]="4"
    ></app-skeleton-loader>
  </div>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadData($event)">
    <ion-infinite-scroll-content loadingSpinner="crescent">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
