name: Mobile release

# Pipeline de publicación para las apps Capacitor del monorepo.
#
# Grafo de trabajos (lo que puede ir en paralelo y lo que no):
#
#   prepare ──> build-web ──┬──> android ──> (Google Play)
#                           └──> ios     ──> (TestFlight)
#
# build-web es el único cuello de botella real: `cap sync` de las dos
# plataformas necesita el mismo `www/`, así que se compila UNA vez en un runner
# Linux (barato) y se pasa como artefacto. android e ios arrancan a la vez en
# cuanto termina; entre ellos no hay ninguna dependencia.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App del monorepo a publicar
        type: choice
        default: train-fit-front
        options:
          - train-fit-front
          - train-fit-management
          - train-fit-trainers
      environment:
        description: Configuración de Angular con la que se compila el web
        type: choice
        default: production
        options:
          - production
          - pre
      platform:
        description: Plataformas a construir
        type: choice
        default: both
        options:
          - both
          - android
          - ios
      publish:
        description: Subir a las tiendas (si se desmarca, solo genera artefactos)
        type: boolean
        default: false
      android_track:
        description: Canal de Google Play cuando publish=true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      marketing_version:
        description: "Versión visible (opcional; vacío = la del proyecto)"
        type: string
        default: ''

# Dos despliegues simultáneos de la misma app pisarían el mismo versionCode y
# el mismo build de TestFlight. Se serializan, pero NO se cancelan a medias:
# cancelar entre el archive y la subida deja la versión quemada en la tienda.
concurrency:
  group: mobile-release-${{ inputs.app }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # Google Play exige versionCode estrictamente creciente EN TODAS LAS PISTAS A
  # LA VEZ (internal/alpha/beta/production comparten el mismo contador, no cada
  # una el suyo). El build.gradle del repo usaba 101347, pero un CI antiguo con
  # fastlane dejó en la pista "internal" un release ya completado con
  # versionCode 94000561 (fastlane suele codificar MAJOR*1_000_000 + build, p.
  # ej. versión 94.0.0 build 561). Esa marca de agua histórica manda, no la del
  # build.gradle: la base tiene que superarla o Play rechaza el rollout con
  # "does not allow any existing users to upgrade" aunque el número sea más
  # alto que el de producción. Comprobar antes de tocar esto:
  #   GET .../androidpublisher/v3/applications/{package}/edits/{id}/tracks/{track}
  #   para cada pista, y usar el mayor versionCode visto + margen.
  ANDROID_VERSION_CODE_BASE: '95000000'

jobs:
  # ---------------------------------------------------------------------------
  # Resuelve rutas y flags una sola vez para que los demás trabajos no repitan
  # la misma lógica de `if`. Cuesta segundos y evita desincronizaciones.
  # ---------------------------------------------------------------------------
  prepare:
    name: Preparar
    runs-on: ubuntu-latest
    outputs:
      app_dir: apps/${{ inputs.app }}
      ng_configuration: ${{ inputs.environment }}
      build_android: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
      build_ios: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
      version_code: ${{ steps.versions.outputs.version_code }}
      build_number: ${{ steps.versions.outputs.build_number }}
    steps:
      - id: versions
        run: |
          echo "version_code=$(( ${{ env.ANDROID_VERSION_CODE_BASE }} + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Bundle web compartido por Android e iOS.
  # ---------------------------------------------------------------------------
  build-web:
    name: Build web (${{ inputs.environment }})
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --fund=false

      # Se llama a `ng` directamente en vez de al script `build:pro`, que usa
      # `ionic build`: @ionic/cli no está en las dependencias del repo, solo
      # instalado a mano en local, así que en CI el script fallaría con
      # "ionic: command not found". `ionic build` no es más que `ng build`.
      - name: Compilar Angular
        working-directory: ${{ needs.prepare.outputs.app_dir }}
        run: npx ng build --configuration=${{ needs.prepare.outputs.ng_configuration }}

      - name: Publicar www como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ inputs.app }}
          path: ${{ needs.prepare.outputs.app_dir }}/www
          retention-days: 5
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android — runner Linux, 1/10 del coste en minutos que macOS.
  # ---------------------------------------------------------------------------
  android:
    name: Android (AAB)
    needs: [prepare, build-web]
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # AGP 8.7 + el `compileOptions` que genera Capacitor exigen Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # node_modules hace falta también aquí: `cap sync` resuelve las rutas de
      # los plugins contra node_modules y regenera capacitor-cordova-android-plugins,
      # que app/build.gradle incluye como proyecto.
      - name: Instalar dependencias
        run: npm ci --no-audit --fund=false

      - name: Descargar www
        uses: actions/download-artifact@v4
        with:
          name: www-${{ inputs.app }}
          path: ${{ needs.prepare.outputs.app_dir }}/www

      - name: Sincronizar Capacitor
        working-directory: ${{ needs.prepare.outputs.app_dir }}
        run: npx cap sync android

      - name: Restaurar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Construir AAB firmado
        working-directory: ${{ needs.prepare.outputs.app_dir }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ needs.prepare.outputs.version_code }} \
            ${{ inputs.marketing_version != '' && format('-PversionName={0}', inputs.marketing_version) || '' }} \
            --no-daemon --stacktrace

      - name: Verificar que el AAB va firmado
        working-directory: ${{ needs.prepare.outputs.app_dir }}/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::No se generó $AAB"; exit 1; }
          unzip -l "$AAB" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            || { echo "::error::El AAB no está firmado (¿keystore mal configurado?)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.app }}-${{ needs.prepare.outputs.version_code }}
          path: ${{ needs.prepare.outputs.app_dir }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Subir a Google Play
        if: inputs.publish
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'com.trainfit.trainfit' }}
          releaseFiles: ${{ needs.prepare.outputs.app_dir }}/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.android_track }}
          status: completed

  # ---------------------------------------------------------------------------
  # iOS — arranca a la vez que android, no después.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (IPA)
    needs: [prepare, build-web]
    if: needs.prepare.outputs.build_ios == 'true'
    runs-on: macos-15
    env:
      APP_DIR: ${{ needs.prepare.outputs.app_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar dependencias
        run: npm ci --no-audit --fund=false

      - name: Descargar www
        uses: actions/download-artifact@v4
        with:
          name: www-${{ inputs.app }}
          path: ${{ env.APP_DIR }}/www

      # `cap sync ios` copia el web y regenera el Podfile; el `pod install` que
      # lanza por dentro se aprovecha de la caché de abajo.
      - name: Cachear CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.APP_DIR }}/ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ inputs.app }}-${{ hashFiles(format('{0}/ios/App/Podfile.lock', env.APP_DIR)) }}
          restore-keys: pods-${{ inputs.app }}-

      - name: Sincronizar Capacitor
        working-directory: ${{ env.APP_DIR }}
        env:
          LANG: en_US.UTF-8
        run: npx cap sync ios

      # Certificado de distribución en un llavero temporal propio del job: no se
      # toca el llavero de login del runner y desaparece con la máquina.
      - name: Instalar certificado de firma
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "::error::Falta el secreto APPLE_CERTIFICATE_P12_BASE64"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      # Clave de App Store Connect: sirve para que xcodebuild cree/actualice
      # solos los perfiles de los DOS bundle IDs (la app y la extensión
      # TrainFitWidget) y para subir el build después.
      - name: Preparar clave de App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "::error::Faltan APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_PRIVATE_KEY"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archivar
        working-directory: ${{ env.APP_DIR }}/ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4YRKMJXVS6' }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ -n "${{ inputs.marketing_version }}" ]; then
            EXTRA+=("MARKETING_VERSION=${{ inputs.marketing_version }}")
          fi
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ needs.prepare.outputs.build_number }} \
            "${EXTRA[@]}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Exportar IPA
        working-directory: ${{ env.APP_DIR }}/ios/App
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4YRKMJXVS6' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.app }}-${{ needs.prepare.outputs.build_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # CFBundleShortVersionString/CFBundleVersion/CFBundleIdentifier reales,
      # leidos del propio IPA exportado en vez de recalculados: es la unica
      # fuente que no puede desincronizarse de lo que Apple va a procesar, y
      # sirve tanto si marketing_version quedo vacio (usa el default del
      # proyecto) como si se lanzo para train-fit-front/management/trainers
      # (bundle id distinto cada vez).
      - name: Leer versión real del IPA
        id: ipa_version
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          WORKDIR="$(mktemp -d)"
          unzip -q "$IPA" -d "$WORKDIR"
          APP_PLIST="$(find "$WORKDIR/Payload" -maxdepth 2 -iname Info.plist | head -1)"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$BUNDLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "IPA: $BUNDLE_ID $MARKETING_VERSION ($BUNDLE_VERSION)"

      - name: Subir a TestFlight
        id: upload_testflight
        if: inputs.publish
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          # altool puede salir con codigo 0 aunque la subida haya fallado de
          # verdad (pasó en un run anterior: "UPLOAD FAILED" en el log,
          # step marcado como exitoso). Se comprueba el texto, no solo el
          # exit code.
          set -o pipefail
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if ! grep -q "UPLOAD SUCCEEDED" "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool no confirmo 'UPLOAD SUCCEEDED' - la subida a TestFlight fallo de verdad"
            exit 1
          fi

      # Todo esto se hacia a mano en App Store Connect tras cada build:
      # documentacion de cifrado, notificar testers, texto de "que probar" y
      # asignar el build al grupo externo. Se automatiza aqui via API.
      - name: Configurar cumplimiento de exportación y TestFlight
        if: inputs.publish
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: ${{ steps.ipa_version.outputs.bundle_id }}
          MARKETING_VERSION: ${{ steps.ipa_version.outputs.marketing_version }}
          BUNDLE_VERSION: ${{ steps.ipa_version.outputs.bundle_version }}
          # Respuestas fijas al cuestionario "Documentación sobre encriptación
          # de la app" de App Store Connect. Corresponden a la opcion 2 del
          # dialogo de Apple ("Algoritmos de encriptación estándar en lugar
          # de, o además de, utilizar la encriptación del sistema operativo de
          # Apple") y a "No" en la pregunta de disponibilidad en Francia.
          # Cambiar aqui si la respuesta real deja de ser esta.
          ENCRYPTION_PROPRIETARY: 'false'
          ENCRYPTION_STANDARD_OR_THIRD_PARTY: 'true'
          ENCRYPTION_AVAILABLE_IN_FRANCE: 'false'
          BETA_GROUP_NAME: 'Beta testers 1.0'
          BETA_WHATS_NEW: 'Nueva versión disponible para probar'
        run: |
          set -euo pipefail

          # 1) JWT firmado ES256 para la API de App Store Connect (misma
          #    clave que ya usa altool, reutilizada aqui via curl directo
          #    porque altool no expone estos endpoints).
          JWT="$(node -e '
            const crypto = require("crypto");
            const b64url = (buf) => buf.toString("base64").replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
            const header = { alg: "ES256", kid: process.env.APP_STORE_CONNECT_KEY_ID, typ: "JWT" };
            const now = Math.floor(Date.now() / 1000);
            const payload = { iss: process.env.APP_STORE_CONNECT_ISSUER_ID, iat: now, exp: now + 1200, aud: "appstoreconnect-v1" };
            const unsigned = b64url(Buffer.from(JSON.stringify(header))) + "." + b64url(Buffer.from(JSON.stringify(payload)));
            const sign = crypto.createSign("SHA256");
            sign.update(unsigned);
            const sig = sign.sign({ key: process.env.APP_STORE_CONNECT_PRIVATE_KEY, dsaEncoding: "ieee-p1363" });
            process.stdout.write(unsigned + "." + b64url(sig));
          ')"
          API="https://api.appstoreconnect.apple.com/v1"
          # -g desactiva el globbing de curl: sin esto interpreta los [] de
          # filter[bundleId]= como un rango y falla con "bad range in URL".
          auth() { curl -sS -g --fail-with-body -H "Authorization: Bearer $JWT" "$@"; }

          # 2) ID de la app por bundle id (no hardcodeado: sirve para
          #    train-fit-front/management/trainers segun cual se este
          #    desplegando).
          APP_ID="$(auth "$API/apps?filter[bundleId]=$BUNDLE_ID" | jq -r '.data[0].id // empty')"
          if [ -z "$APP_ID" ]; then
            echo "::error::No se encontro ninguna app con bundle id $BUNDLE_ID en App Store Connect"
            exit 1
          fi
          echo "App $BUNDLE_ID -> $APP_ID"

          # 3) Esperar a que Apple termine de procesar el build. altool
          #    confirma la subida al momento, pero el build tarda varios
          #    minutos en pasar de PROCESSING a VALID via API.
          BUILD_ID=""
          STATE=""
          for i in $(seq 1 40); do
            RESP="$(auth "$API/builds?filter[app]=$APP_ID&filter[version]=$BUNDLE_VERSION&filter[preReleaseVersion.version]=$MARKETING_VERSION&limit=1")"
            BUILD_ID="$(echo "$RESP" | jq -r '.data[0].id // empty')"
            STATE="$(echo "$RESP" | jq -r '.data[0].attributes.processingState // empty')"
            echo "Intento $i/40: build=$BUILD_ID estado=$STATE"
            [ "$STATE" = "VALID" ] && break
            if [ "$STATE" = "FAILED" ] || [ "$STATE" = "INVALID" ]; then
              echo "::error::Apple rechazo el build tras procesarlo (estado $STATE) - revisar a mano en App Store Connect"
              exit 1
            fi
            sleep 30
          done
          if [ "$STATE" != "VALID" ]; then
            echo "::error::El build $MARKETING_VERSION ($BUNDLE_VERSION) no llego a VALID tras 20 min. Configurar a mano en App Store Connect."
            exit 1
          fi

          # 4) Documentacion de cumplimiento de exportacion (encriptacion).
          DECL_ID="$(auth -X POST "$API/appEncryptionDeclarations" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg desc "$BUNDLE_ID" \
              --argjson french "$ENCRYPTION_AVAILABLE_IN_FRANCE" \
              --argjson proprietary "$ENCRYPTION_PROPRIETARY" \
              --argjson thirdparty "$ENCRYPTION_STANDARD_OR_THIRD_PARTY" \
              --arg appId "$APP_ID" \
              '{data:{type:"appEncryptionDeclarations",attributes:{appDescription:$desc,availableOnFrenchStore:$french,containsProprietaryCryptography:$proprietary,containsThirdPartyCryptography:$thirdparty},relationships:{app:{data:{type:"apps",id:$appId}}}}}')" \
            | jq -r '.data.id')"
          echo "Declaracion de cifrado creada: $DECL_ID"

          auth -X PATCH "$API/builds/$BUILD_ID" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$BUILD_ID" --arg decl "$DECL_ID" \
              '{data:{type:"builds",id:$id,relationships:{appEncryptionDeclaration:{data:{type:"appEncryptionDeclarations",id:$decl}}}}}')" \
            -o /dev/null
          echo "Build asociado a la declaracion de cifrado"

          # 5) Notificar automaticamente a los testers en cuanto el build
          #    quede disponible.
          BBD_ID="$(auth "$API/builds/$BUILD_ID/buildBetaDetail" | jq -r '.data.id')"
          auth -X PATCH "$API/buildBetaDetails/$BBD_ID" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$BBD_ID" '{data:{type:"buildBetaDetails",id:$id,attributes:{autoNotifyEnabled:true}}}')" \
            -o /dev/null
          echo "Notificacion automatica a testers: activada"

          # 6) Texto de "que probar", en el idioma principal de la app.
          LOCALE="$(auth "$API/apps/$APP_ID" | jq -r '.data.attributes.primaryLocale')"
          EXISTING="$(auth "$API/builds/$BUILD_ID/betaBuildLocalizations" | jq -r --arg l "$LOCALE" '.data[] | select(.attributes.locale==$l) | .id' | head -1)"
          if [ -n "$EXISTING" ]; then
            auth -X PATCH "$API/betaBuildLocalizations/$EXISTING" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg id "$EXISTING" --arg wn "$BETA_WHATS_NEW" \
                '{data:{type:"betaBuildLocalizations",id:$id,attributes:{whatsNew:$wn}}}')" \
              -o /dev/null
          else
            auth -X POST "$API/betaBuildLocalizations" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg build "$BUILD_ID" --arg locale "$LOCALE" --arg wn "$BETA_WHATS_NEW" \
                '{data:{type:"betaBuildLocalizations",attributes:{locale:$locale,whatsNew:$wn},relationships:{build:{data:{type:"builds",id:$build}}}}}')" \
              -o /dev/null
          fi
          echo "Texto 'que probar' ($LOCALE): listo"

          # 7) Asignar el build al grupo externo de beta testers. El grupo
          #    tiene que existir ya en App Store Connect (se crea una vez a
          #    mano); este paso solo lo reutiliza.
          # filter[name] en betaGroups devuelve 400 (no soportado); se lista
          # y se filtra con jq en vez de depender de ese filtro.
          GROUP_ID="$(auth "$API/apps/$APP_ID/betaGroups?limit=50" | jq -r --arg n "$BETA_GROUP_NAME" '.data[] | select(.attributes.name==$n) | .id' | head -1)"
          if [ -z "$GROUP_ID" ]; then
            echo "::error::No existe el grupo externo '$BETA_GROUP_NAME' en App Store Connect. Creelo una vez a mano con ese nombre exacto."
            exit 1
          fi
          auth -X POST "$API/betaGroups/$GROUP_ID/relationships/builds" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$BUILD_ID" '{data:[{type:"builds",id:$id}]}')" \
            -o /dev/null
          echo "Build asignado al grupo '$BETA_GROUP_NAME'"

          echo "Listo: $BUNDLE_ID $MARKETING_VERSION ($BUNDLE_VERSION) configurado y notificado."

      - name: Limpiar llavero
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
