name: Web CI

# Verificación de la rama de PRO. NO despliega: la web de trainers la publican
# las apps de Cloudflare Workers por su cuenta (develop -> PRE, main -> PRO), y
# las apps móviles se publican con mobile-release.yml o a mano.
#
#   lint ──┐
#   test ──┴──> build (3 apps en paralelo, configuración production)
#
# lint y test corren a la vez. build es matriz porque las tres apps comparten
# packages/: un cambio ahí puede romper el AOT de una app y compilar en otra.
# No hay secretos: lo único que cambia entre entornos está en
# apps/<app>/src/environments/ y lo elige angular.json.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --fund=false

      # packages/ y las tres apps.
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: varios tests importan los `.ts` de la app con
      # --experimental-strip-types, que Node 20 no conoce.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --fund=false

      - run: npm test

  build:
    name: Build ${{ matrix.app }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - train-fit-trainers
          - train-fit-front
          - train-fit-management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --fund=false

      # Los scripts de build usan `ionic build`, y @ionic/cli no está en las
      # dependencias del repo: en local va instalado global, aquí también.
      # Misma major que en local (7.x).
      - name: Instalar Ionic CLI
        run: npm install -g @ionic/cli@7 --no-audit --fund=false

      # El mismo script que se usa en local, sin su `prebuild:pro` (lint +
      # test): ya han pasado en sus propios trabajos, y aquí el test fallaría
      # porque este trabajo va en Node 20.
      - name: Compilar Angular
        working-directory: apps/${{ matrix.app }}
        run: npm run build:pro --ignore-scripts
