<ion-header class="filter-header">
  <div class="filter-toolbar">
    <div class="header-content">
      <div class="title-section">
        <ion-title class="filter-title">Filtros</ion-title>
      </div>
      <ion-buttons slot="end">
        <button class="close-action-button ripple-effect" (click)="apply()">
          <ion-icon name="close" color="primary"></ion-icon>
        </button>
      </ion-buttons>
    </div>
  </div>
</ion-header>

<ion-content class="filter-content">
  <div class="filter-container">
    <div class="filter-section">
      <div class="section-header">
        <ion-icon name="diamond-outline" class="section-icon"></ion-icon>
        <h3 class="section-title">Suscripción</h3>
      </div>
      <div class="chips-container">
        <button
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="draftFilter.premiumOnly"
          (click)="togglePremiumFilter()"
        >
          <span class="label">Premium</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>

        <button
          *ngIf="draftFilter.premiumOnly || draftFilter.premiumLifetimeOnly"
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="draftFilter.premiumLifetimeOnly"
          (click)="togglePremiumLifetimeFilter()"
        >
          <span class="label">Premium Lifetime</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      </div>
    </div>

    <div class="filter-section">
      <div class="section-header">
        <ion-icon name="key-outline" class="section-icon"></ion-icon>
        <h3 class="section-title">Hash</h3>
      </div>
      <div class="chips-container">
        <button
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="draftFilter.withHashOnly"
          (click)="toggleHashFilter()"
        >
          <span class="label">Hash</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      </div>
    </div>

    <div class="filter-section">
      <div class="section-header">
        <ion-icon name="time-outline" class="section-icon"></ion-icon>
        <h3 class="section-title">Actividad</h3>
      </div>
      <div class="chips-container">
        <button
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="isActivityActive"
          (click)="toggleActivityFilter()"
        >
          <span class="label">Actividad</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>

        <button
          *ngIf="isActivityActive"
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="draftFilter.activitySort === 'desc'"
          (click)="setActivitySort('desc')"
        >
          <ion-icon name="arrow-down-outline"></ion-icon>
          <span class="label">Descendente</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>

        <button
          *ngIf="isActivityActive"
          type="button"
          class="modern-pill filter-chip"
          [class.is-active]="draftFilter.activitySort === 'asc'"
          (click)="setActivitySort('asc')"
        >
          <ion-icon name="arrow-up-outline"></ion-icon>
          <span class="label">Ascendente</span>
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      </div>
    </div>
  </div>
</ion-content>
