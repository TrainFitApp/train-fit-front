// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // @capgo/capacitor-social-login pide androidx.browser:browser:1.9.0 a
    // pelo (hardcodeado, sin variable configurable en su build.gradle), y
    // esa version exige compileSdk 36 / AGP 8.9.1+ — este proyecto sigue en
    // compileSdk 35 / AGP 8.7.2 (variables.gradle), igual que management y
    // el cliente. Sin forzar la version, Gradle resuelve al MAYOR pedido
    // (1.9.0) y el build falla en :app:checkDebugAarMetadata. Mismo fix ya
    // aplicado en train-fit-management/android/build.gradle.
    configurations.all {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
