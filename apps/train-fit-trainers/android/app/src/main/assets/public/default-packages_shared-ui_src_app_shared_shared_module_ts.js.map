<div
  class="note-wrapper"
  #noteRef
  [ngClass]="{ 'previous-session': isPrevious, disabled: isLoading, readonly: !canModify }"
  (click)="showManageNotesAlert($event)"
>
  <div class="note-card">
    <div class="card-header">
      <div class="left-section">
        <div class="icon-wrapper">
          <ion-icon name="create-outline"></ion-icon>
        </div>
        <div class="header-row">
          <span class="title">{{ noteType }}</span>
        </div>
      </div>

      <div class="action-wrapper">
        <ion-button
          *ngIf="canDelete"
          fill="clear"
          size="small"
          class="close-button"
          [disabled]="isLoading || !canModify"
          (click)="showCloseAlert($event); $event.stopPropagation()"
        >
          <ion-icon name="close" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>

    <p class="text">{{ notes }}</p>
  </div>
</div>
