<ion-fab
  [hidden]="(isFooterHidden || modalOpen) && !ignoreModalHide"
  horizontal="end"
  vertical="bottom"
  size="small"
  slot="fixed"
>
  <ion-fab-button *ngIf="loading; else loaded" color="primary">
    <ion-spinner name="crescent"></ion-spinner>
  </ion-fab-button>
  <ng-template #loaded>
    <ion-fab-button color="primary" (click)="actionFab()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ng-template>
</ion-fab>
