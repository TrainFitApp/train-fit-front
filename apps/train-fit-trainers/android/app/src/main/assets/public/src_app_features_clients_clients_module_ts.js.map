<div class="nutrition-calendar">
  <div class="nutrition-calendar__header">
    <button
      type="button"
      class="nutrition-calendar__nav-btn"
      aria-label="Mes anterior"
      (click)="previousMonth()"
    >
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <span class="nutrition-calendar__month-label">{{ monthLabel }}</span>
    <button
      type="button"
      class="nutrition-calendar__nav-btn"
      aria-label="Mes siguiente"
      (click)="nextMonth()"
    >
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
  </div>

  <div class="nutrition-calendar__toolbar">
    <div class="nutrition-calendar__toolbar-row">
      <button
        type="button"
        class="range-toggle-btn"
        [class.is-active]="isRangeMode"
        (click)="toggleRangeMode()"
      >
        <ion-icon name="calendar-clear-outline"></ion-icon>
        {{ rangeToggleLabel }}
      </button>

      <button
        type="button"
        class="range-clear-btn"
        *ngIf="rangeStart && !isRangeMode"
        aria-label="Quitar rango seleccionado"
        (click)="clearRange()"
      >
        <ion-icon name="close-circle-outline"></ion-icon>
        {{ rangeStart }} → {{ rangeEnd }}
      </button>
    </div>
  </div>

  <div class="nutrition-calendar__weekdays">
    <span *ngFor="let label of weekdayLabels">{{ label }}</span>
  </div>

  <div class="nutrition-calendar__grid" [class.is-loading]="isLoading" (mouseleave)="onGridMouseLeave()">
    <button
      type="button"
      class="nutrition-calendar__cell"
      *ngFor="let cell of cells; trackBy: trackByCell"
      [class.is-blank]="!cell.date"
      [class.is-selected]="!!cell.date && cell.date === selectedDate"
      [class.is-today]="!!cell.date && cell.date === todayIso"
      [class.has-no-plan]="!!cell.compliance && !cell.compliance.hasPlan"
      [class.has-exception]="!!cell.compliance?.hasException"
      [class.is-skip-exception]="cell.compliance?.exceptionType === 'skip'"
      [class.has-phase]="!!cell.phase"
      [class.is-in-range]="isInRange(cell.date)"
      [class.is-range-endpoint]="cell.date === rangeStart || cell.date === rangeEnd"
      [class.is-range-pick-mode]="isRangeMode"
      [disabled]="!cell.date"
      [style.--fill-opacity]="cellFillOpacity(cell)"
      [style.--phase-color]="cell.phase?.color"
      [title]="cell.phase?.planName || null"
      (click)="selectDay(cell)"
      (mouseenter)="onCellHover(cell)"
    >
      <span class="nutrition-calendar__phase-bar" *ngIf="cell.phase"></span>
      <span class="nutrition-calendar__day-number" *ngIf="cell.dayNumber">{{ cell.dayNumber }}</span>
      <span class="nutrition-calendar__exception-dot" *ngIf="cell.compliance?.hasException"></span>
    </button>
  </div>

  <!-- La leyenda va en DOS bloques porque cada casilla superpone dos cosas
       distintas: lo que dice del cliente (relleno, barra, excepciones) y
       dónde estás mirando tú (hoy, seleccionado, rango). Mezclarlas en una
       fila hacía leer el borde naranja del rango como si fuera un dato. -->
  <div class="nutrition-calendar__legend">
    <p class="legend-title">Qué dice del cliente</p>

    <!-- Escala, no un cuadradito: el cumplimiento se lee por INTENSIDAD del
         relleno, no por color. Con una muestra única no había forma de
         saberlo. -->
    <span class="legend-item legend-item--scale">
      <span class="legend-scale" aria-hidden="true">
        <span class="legend-scale__step" style="--step: 0.14"></span>
        <span class="legend-scale__step" style="--step: 0.35"></span>
        <span class="legend-scale__step" style="--step: 0.55"></span>
      </span>
      Cumplimiento: de nada a todo
    </span>

    <span class="legend-item">
      <span class="legend-swatch legend-swatch--phase"></span>
      Fase del plan (un color por fase)
    </span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--exception"></span>Excepción</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--empty"></span>Sin plan ese día</span>
  </div>

  <div class="nutrition-calendar__legend nutrition-calendar__legend--nav">
    <p class="legend-title">Dónde estás mirando</p>
    <span class="legend-item"><span class="legend-swatch legend-swatch--today"></span>Hoy</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--selected"></span>Día seleccionado</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--range"></span>Dentro del rango</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--endpoint"></span>Inicio y fin del rango</span>
  </div>

  <!-- Debajo de la leyenda y no en la tarjeta del plan: la acción es sobre
       el día que se acaba de pulsar en el calendario, y antes había que
       cruzar media pantalla para ejecutarla sobre una fecha que se elegía
       aquí. El texto nombra el día para que no haya duda de cuál se marca. -->
  <button
    type="button"
    class="exception-btn"
    *ngIf="canCreateException"
    [disabled]="isCreatingException"
    (click)="exceptionRequested.emit(selectedDate)"
  >
    <ion-icon name="close-circle-outline" aria-hidden="true"></ion-icon>
    Marcar {{ selectedDateLabel }} como excepción
  </button>
</div>
