<ion-header class="ion-no-border">
  <div class="tf-page-header">
    <div class="tf-page-header__content">
      <div class="tf-page-header__back-section">
        <button type="button" class="tf-page-header__back-button" (click)="close()" [attr.aria-label]="'COMMON.BACK' | translate">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
      </div>
      <div class="tf-page-header__title-section">
        <button type="button" class="tf-page-header__title routine-title-button" (click)="renameTable()">
          <span class="routine-title-text">{{ table?.name }}</span>
          <ion-icon name="pencil-outline"></ion-icon>
        </button>
      </div>
      <div class="tf-page-header__actions"></div>
    </div>
  </div>

  <div class="planner-toolbar">
    <button type="button" class="toolbar-btn toolbar-btn--primary" [disabled]="busy" (click)="addWeek()" [attr.aria-label]="'PLANNER.ADD_WEEK' | translate">
      <ion-icon name="add-outline"></ion-icon>
      <span>{{ 'PLANNER.ADD_WEEK' | translate }}</span>
    </button>
    <button type="button" class="toolbar-btn" [disabled]="busy || !selectedSplit" (click)="duplicateSelectedWeek()" [attr.aria-label]="'PLANNER.DUPLICATE_WEEK' | translate">
      <ion-icon name="duplicate-outline"></ion-icon>
      <span>{{ 'PLANNER.DUPLICATE_WEEK' | translate }}</span>
    </button>
    <button type="button" class="toolbar-btn toolbar-btn--danger" [disabled]="!selectedSplit" (click)="confirmDeleteSelectedWeek()" [attr.aria-label]="'PLANNER.DELETE_WEEK' | translate">
      <ion-icon name="trash-outline"></ion-icon>
      <span>{{ 'PLANNER.DELETE_WEEK' | translate }}</span>
    </button>
  </div>
</ion-header>

<ion-content class="planner-content" scrollY="false">
  <div
    class="planner-board"
    cdkDropList
    cdkDropListOrientation="horizontal"
    [cdkDropListData]="table?.splits"
    (cdkDropListDropped)="onColumnsDropped($event)"
  >
    <app-planner-column
      *ngFor="let split of table?.splits; trackBy: trackBySplitId"
      cdkDrag
      cdkDragLockAxis="x"
      [cdkDragData]="split"
      class="planner-board-column"
      [split]="split"
      [table]="table"
      [selected]="split._id === selectedSplitId"
      [dimmed]="draggingFromSplitId !== null && draggingFromSplitId !== split._id"
      (columnSelected)="selectSplit(split._id)"
      (columnRenamed)="renameSplit(split)"
      (cardDragStarted)="onCardDragStarted(split._id)"
      (cardDragEnded)="onCardDragEnded()"
      (templatesApplyStarted)="onTemplatesApplyStarted()"
      (templatesApplyEnded)="onTemplatesApplyEnded()"
    ></app-planner-column>

    <div class="planner-empty" *ngIf="table && table.splits.length === 0">
      <ion-icon name="albums-outline" aria-hidden="true"></ion-icon>
      <h2>{{ 'PLANNER.NO_WEEKS_YET' | translate }}</h2>
      <button type="button" class="planner-empty-cta" (click)="addWeek()">
        <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
        <span>{{ 'PLANNER.ADD_WEEK' | translate }}</span>
      </button>
    </div>

    <!-- Tarea (2026-08) — cubre TODO el tablero mientras "Añadir desde
         plantilla" hace su secuencia de llamadas, para que el resultado se
         revele de golpe en vez de ir apareciendo microciclo a microciclo. -->
    <div class="planner-board-overlay" *ngIf="applyingTemplates">
      <ion-spinner name="crescent"></ion-spinner>
      <span>{{ 'PLANNER.APPLYING_TEMPLATES' | translate }}</span>
    </div>
  </div>

  <!-- "Copiar ejercicios" (2026-08) — visible en TODO el tablero mientras el
       modo copiar está activo en cualquier card, para poder cancelarlo desde
       cualquier sitio sin tener que volver a desplazarse hasta la card de
       origen. No bloquea nada (a diferencia del overlay de arriba): el
       entrenador sigue pudiendo marcar ejercicios y pulsar "Pegar" con este
       banner visible. -->
  <div class="planner-copy-banner" *ngIf="exerciseCopy.copyActive()">
    <ion-icon name="copy-outline"></ion-icon>
    <span *ngIf="exerciseCopy.selectedCount() === 0">{{ 'PLANNER.COPY_MODE_EMPTY' | translate }}</span>
    <span *ngIf="exerciseCopy.selectedCount() === 1">{{ 'PLANNER.COPY_MODE_COUNT_SINGULAR' | translate }}</span>
    <span *ngIf="exerciseCopy.selectedCount() > 1">{{ 'PLANNER.COPY_MODE_COUNT_PLURAL' | translate: { count: exerciseCopy.selectedCount() } }}</span>
    <button type="button" class="planner-copy-banner-cancel" (click)="exerciseCopy.cancel()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
  </div>
</ion-content>
