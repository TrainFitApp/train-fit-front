<aside class="insights-panel" [class.insights-panel--collapsed]="collapsed">
  <button
    type="button"
    class="panel-toggle"
    [attr.aria-expanded]="!collapsed"
    [attr.aria-label]="collapsed ? ('PLANNER.MOSTRAR_EL_PANEL_DE_ANALISIS' | translate) : ('PLANNER.OCULTAR_EL_PANEL_DE_ANALISIS' | translate)"
    (click)="toggle()"
  >
    <ion-icon [name]="collapsed ? 'chevron-back-outline' : 'chevron-forward-outline'" aria-hidden="true"></ion-icon>
    <span class="panel-toggle-label" *ngIf="!collapsed">{{ 'PLANNER.ANALISIS' | translate }}</span>
  </button>

  <ng-container *ngIf="!collapsed">
    <!-- Cada pestaña lleva debajo la PREGUNTA que responde: es lo que
         distingue dos listas de músculos que, sin eso, se leen como el mismo
         dato contado de dos formas distintas. -->
    <ion-segment
      class="insights-tabs"
      [value]="tab"
      (ionChange)="onSegmentChange($any($event).detail?.value)"
    >
      <ion-segment-button value="week">
        <ion-label>{{ 'TRAINER_COMMON.WEEK' | translate }}</ion-label>
      </ion-segment-button>
      <ion-segment-button value="session">
        <ion-label>{{ 'PLANNER.SESION' | translate }}</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="insights-body">
      <ng-container *ngIf="tab === 'week'">
        <p class="tab-question">{{ 'PLANNER.CUANTAS_SERIES_LE_DOY_CADA' | translate }}</p>
        <app-muscle-volume-panel
          [embedded]="true"
          [split]="split"
          [previousSplit]="previousSplit"
          [splitLabel]="splitLabel"
        >
          <!-- Estrés articular del microciclo: la pestaña Sesión lo da de UNA
               sesión; aquí, sumado sobre toda la semana. Proyectado dentro
               del panel para compartir su padding y su scroll. -->
          <app-joint-stress-panel [split]="split"></app-joint-stress-panel>
        </app-muscle-volume-panel>
      </ng-container>

      <ng-container *ngIf="tab === 'session'">
        <p class="tab-question">{{ 'PLANNER.COMO_QUEDA_REPARTIDA_ESTA_SESION' | translate }}</p>
        <app-session-load-panel [embedded]="true" [workout]="workout"></app-session-load-panel>
      </ng-container>
    </div>
  </ng-container>
</aside>
