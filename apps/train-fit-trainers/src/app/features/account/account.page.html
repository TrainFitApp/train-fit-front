<ion-header class="ion-no-border">
  <div class="tf-page-header">
    <div class="tf-page-header__content">
      <div class="tf-page-header__back-section">
        <ion-menu-button class="tf-page-header__back-button" aria-label="Abrir menú de navegación"></ion-menu-button>
      </div>
      <div class="tf-page-header__title-section">
        <h1 class="tf-page-header__title">Mi cuenta</h1>
      </div>
      <div class="tf-page-header__actions"></div>
    </div>
  </div>
</ion-header>

<ion-content class="account-content">
  <div class="account-card">
    <div class="account-avatar">{{ initials }}</div>
    <div class="account-info">
      <span class="account-name">{{ fullName }}</span>
      <span class="account-email" *ngIf="user()?.email">{{ user()?.email }}</span>
    </div>
  </div>

  <nav class="account-menu">
    <button type="button" class="account-menu-item" (click)="openEditPanel()">
      <ion-icon name="person-outline"></ion-icon>
      <span>Editar perfil</span>
      <ion-icon name="chevron-forward-outline" class="account-menu-chevron"></ion-icon>
    </button>
    <button type="button" class="account-menu-item" (click)="goToSubscription()">
      <ion-icon name="card-outline"></ion-icon>
      <span>Suscripción</span>
      <ion-icon name="chevron-forward-outline" class="account-menu-chevron"></ion-icon>
    </button>
  </nav>

  <button type="button" class="logout-button" (click)="confirmLogout()">
    <ion-icon name="log-out-outline"></ion-icon>
    Cerrar sesión
  </button>

  <div class="panel-backdrop" *ngIf="showEditPanel" (click)="closeEditPanel()"></div>
  <div class="panel-sheet" *ngIf="showEditPanel">
    <div class="panel-handle"></div>
    <h3 class="panel-title">Editar perfil</h3>

    <div class="input-wrapper">
      <ion-icon name="person-outline" class="input-icon"></ion-icon>
      <input type="text" class="input-field" placeholder="Nombre" [(ngModel)]="formName" />
    </div>

    <div class="input-wrapper">
      <ion-icon name="person-outline" class="input-icon"></ion-icon>
      <input type="text" class="input-field" placeholder="Apellidos" [(ngModel)]="formLastname" />
    </div>

    <div class="input-wrapper">
      <ion-icon name="mail-outline" class="input-icon"></ion-icon>
      <input type="email" class="input-field" placeholder="Correo" [(ngModel)]="formEmail" />
    </div>

    <button
      class="submit-button"
      (click)="saveProfile()"
      [disabled]="!formName.trim() || !formLastname.trim() || !formEmail.trim() || isSavingProfile"
      [attr.aria-busy]="isSavingProfile"
    >
      <span *ngIf="!isSavingProfile">Guardar cambios</span>
      <ng-container *ngIf="isSavingProfile">
        <ion-spinner name="dots" aria-hidden="true"></ion-spinner>
        <span class="sr-only">Guardando cambios</span>
      </ng-container>
    </button>
  </div>
</ion-content>
