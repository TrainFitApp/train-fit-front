<ion-header class="ion-no-border">
  <div class="tf-page-header">
    <div class="tf-page-header__content">
      <div class="tf-page-header__back-section">
        <button
          type="button"
          class="tf-page-header__back-button"
          (click)="dismiss()"
          [attr.aria-label]="'COMMON.CLOSE_ARIA' | translate"
        >
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
      <div class="tf-page-header__title-section">
        <h1 class="tf-page-header__title">{{ 'CHECKIN_TEMPLATES.APLICAR' | translate }}{{ template?.name }}"</h1>
      </div>
      <div class="tf-page-header__actions"></div>
    </div>
  </div>
</ion-header>

<ion-content class="apply-modal-content">
  <p class="panel-subtitle">{{ 'CHECKIN_TEMPLATES.ELIGE_EL_CLIENTE_TE_LLEVAMOS' | translate }}</p>

  <div class="input-wrapper" *ngIf="myClients.length">
    <ion-icon name="search-outline" class="input-icon"></ion-icon>
    <input
      type="text"
      class="input-field"
      [placeholder]="'CHECKIN_TEMPLATES.BUSCAR_POR_NOMBRE_CORREO' | translate"
      [ngModel]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>

  <p class="empty-hint" *ngIf="!loadingClients && !myClients.length">{{ 'CHECKIN_TEMPLATES.NO_TIENES_CLIENTES_TODAVIA' | translate }}</p>
  <p class="empty-hint" *ngIf="myClients.length && !filteredClients.length">
    {{ 'CHECKIN_TEMPLATES.NINGUN_CLIENTE_COINCIDE_CON_LA' | translate }}
  </p>

  <div class="apply-client-list">
    <button
      class="apply-client-row"
      *ngFor="let client of filteredClients; trackBy: trackByClientId"
      (click)="choose(client)"
      [disabled]="!client.user"
    >
      <div
        class="apply-client-avatar"
        [style.background]="'hsl(' + getAvatarHue(client) + ', 45%, 22%)'"
        [style.color]="'hsl(' + getAvatarHue(client) + ', 70%, 78%)'"
      >
        {{ getInitials(client) }}
      </div>
      <div class="apply-client-info">
        <span class="apply-client-name">{{ getFullName(client) }}</span>
        <span class="apply-client-email" *ngIf="client.user">{{ client.user.email }}</span>
      </div>
      <ion-icon class="apply-client-check" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </button>
  </div>
</ion-content>
