<ion-header class="ion-no-border">
  <app-page-header [title]="'DIET_TEMPLATES.ELIGE_UNA_DIETA_PARA_LA' | translate"></app-page-header>
</ion-header>

<ion-content class="phase-picker-content">
  <p class="page-hint">
    {{ 'DIET_TEMPLATES.TUS_PLANTILLAS_DE_DIETA_ORDENADAS' | translate }}
    <strong>{{ clientName }}</strong>{{ 'DIET_TEMPLATES.LA_PRIMERA_ES_LA_QUE' | translate }}
  </p>

  <app-diet-suggestion-list (previewed)="openPreview($event)"></app-diet-suggestion-list>
</ion-content>

<!-- Fuera del ion-content, hermano suyo: un panel fixed dentro del scroll de
     la lista se movería con ella. rightOffset = ancho del panel de parámetros
     (.tf-panel-modal-overlay), que flota encima de la página. -->
<app-diet-template-preview-panel
  *ngIf="previewTemplate"
  [template]="previewTemplate"
  [flags]="previewFlags"
  rightOffset="400px"
  (closed)="closePreview()"
></app-diet-template-preview-panel>
