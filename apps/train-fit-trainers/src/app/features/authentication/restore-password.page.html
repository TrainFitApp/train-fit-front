<ion-content class="trainer-auth">
  <main class="auth-layout">
    <section class="auth-panel">
      <button class="back-action" type="button" routerLink="/sign-in" [attr.aria-label]="'COMMON.BACK' | translate">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>

      <header class="auth-copy">
        <p>TrainFit Trainers</p>
        <h1>{{ 'TRAINERS.AUTH.RESET_TITLE' | translate }}</h1>
        <span>{{ 'TRAINERS.AUTH.RESET_COPY' | translate }}</span>
      </header>

      <section class="completion" *ngIf="completed">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <p>{{ 'TRAINERS.AUTH.RESET_SUCCESS' | translate }}</p>
        <button class="primary-action" type="button" routerLink="/sign-in">
          {{ 'TRAINERS.AUTH.LOGIN' | translate }}
        </button>
      </section>

      <form *ngIf="!completed" [formGroup]="resetForm" (ngSubmit)="codeSent ? resetPassword() : sendCode()" novalidate>
        <label for="reset-email">{{ 'TRAINERS.AUTH.EMAIL' | translate }}</label>
        <div class="field">
          <ion-icon name="mail-outline"></ion-icon>
          <input id="reset-email" type="email" formControlName="email" autocomplete="email" [readonly]="codeSent" />
        </div>

        <ng-container *ngIf="codeSent">
          <label for="reset-code">{{ 'TRAINERS.AUTH.VERIFICATION_CODE' | translate }}</label>
          <div class="field code-field"><input id="reset-code" inputmode="numeric" maxlength="6" formControlName="code" autocomplete="one-time-code" /></div>

          <label for="reset-password">{{ 'TRAINERS.AUTH.NEW_PASSWORD' | translate }}</label>
          <div class="field">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input id="reset-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" />
            <button type="button" class="icon-button" (click)="showPassword = !showPassword"><ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon></button>
          </div>

          <label for="reset-password-confirmation">{{ 'TRAINERS.AUTH.REPEAT_PASSWORD' | translate }}</label>
          <div class="field"><ion-icon name="lock-closed-outline"></ion-icon><input id="reset-password-confirmation" [type]="showPassword ? 'text' : 'password'" formControlName="passwordConfirmation" autocomplete="new-password" /></div>
        </ng-container>

        <p class="form-error" *ngIf="error">{{ error }}</p>
        <button class="primary-action" type="submit" [disabled]="loading">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          <span *ngIf="!loading">{{ (codeSent ? 'TRAINERS.AUTH.RESET_PASSWORD' : 'TRAINERS.AUTH.SEND_CODE') | translate }}</span>
        </button>
      </form>
    </section>
  </main>
</ion-content>
