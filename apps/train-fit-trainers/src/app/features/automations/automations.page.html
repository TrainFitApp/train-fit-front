<ion-header class="ion-no-border">
  <app-page-header [title]="'AUTOMATIONS.AVISOS_AUTOMATIZADOS' | translate">
    <ng-container pageActions>
      <button type="button" class="tf-page-header__back-button" (click)="createRule()" [attr.aria-label]="'AUTOMATIONS.NUEVO_AVISO_AUTOMATIZADO' | translate">
        <ion-icon name="add-outline"></ion-icon>
      </button>
    </ng-container>
  </app-page-header>
</ion-header>

<ion-content class="automations-content" appScrollMemory="automations">
  <div class="page-skeleton" *ngIf="state === 'loading'">
    <div class="skeleton-block rule-card-skeleton"></div>
    <div class="skeleton-block rule-card-skeleton"></div>
  </div>

  <div class="page-state" *ngIf="state === 'error'">
    <ion-icon name="cloud-offline-outline" aria-hidden="true"></ion-icon>
    <h2>{{ 'AUTOMATIONS.NO_SE_PUDIERON_CARGAR_TUS' | translate }}</h2>
    <button type="button" class="retry-button" (click)="load()">{{ 'COMMON.RETRY' | translate }}</button>
  </div>

  <!-- Estado vacío que enseña qué es esto, con un ejemplo concreto: "no hay
       nada" no explicaría para qué sirve la pantalla. -->
  <div class="page-state page-state--intro" *ngIf="state === 'loaded' && !rules.length">
    <ion-icon name="git-branch-outline" aria-hidden="true"></ion-icon>
    <h2>{{ 'AUTOMATIONS.TU_METODOLOGIA_APLICADA_SOLA' | translate }}</h2>
    <p>
      {{ 'AUTOMATIONS.UN_AVISO_AUTOMATIZADO_VIGILA_TUS' | translate }} <em>{{ 'AUTOMATIONS.SI_EL_PESO_APENAS_BAJA' | translate }}</em>.
    </p>
    <button type="button" class="primary-button" (click)="createRule()">
      {{ 'AUTOMATIONS.CREAR_MI_PRIMER_AVISO_AUTOMATIZADO' | translate }}
    </button>
  </div>

  <ul class="rule-list" *ngIf="state === 'loaded' && rules.length">
    <li class="rule-card" *ngFor="let rule of rules; trackBy: trackByRuleId" [class.rule-card--off]="!rule.enabled">
      <button type="button" class="rule-main" (click)="openRule(rule)">
        <span class="rule-head">
          <span class="rule-name">{{ rule.name }}</span>
          <span class="level-chip" [class.level-chip--auto]="rule.level === 'automatic'">
            {{ levelLabel(rule) }}
          </span>
        </span>

        <span class="rule-description" *ngIf="rule.description">{{ rule.description }}</span>

        <span class="rule-meta">
          <span class="rule-meta-item">
            <ion-icon name="time-outline" aria-hidden="true"></ion-icon>{{ triggerLabel(rule) }}
          </span>
          <span class="rule-meta-item">
            <ion-icon name="funnel-outline" aria-hidden="true"></ion-icon>{{ conditionsLabel(rule) }}
          </span>
          <span class="rule-meta-item">
            <ion-icon name="people-outline" aria-hidden="true"></ion-icon>{{ scopeLabel(rule) }}
          </span>
        </span>

        <!-- El sistema la apagó solo. Se explica en vez de dejar un
             interruptor apagado que parecería un fallo. -->
        <span class="rule-warning" *ngIf="rule.disabledReason">
          <ion-icon name="warning-outline" aria-hidden="true"></ion-icon>{{ rule.disabledReason }}
        </span>
      </button>

      <div class="rule-actions">
        <button
          type="button"
          class="rule-switch"
          [class.rule-switch--on]="rule.enabled"
          [disabled]="isToggling(rule)"
          (click)="toggleRule(rule, $event)"
          role="switch"
          [attr.aria-checked]="rule.enabled"
          [attr.aria-label]="(rule.enabled ? ('AUTOMATIONS.DESACTIVAR' | translate) : ('AUTOMATIONS.ACTIVAR' | translate)) + ' ' + rule.name"
        >
          <span class="rule-switch-knob" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="rule-delete"
          (click)="confirmDelete(rule, $event)"
          [attr.aria-label]="('AUTOMATIONS.ELIMINAR' | translate) + rule.name"
        >
          <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </li>
  </ul>
</ion-content>
