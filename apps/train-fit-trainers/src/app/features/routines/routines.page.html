<ion-header class="ion-no-border">
  <app-page-header [title]="'ROUTINES.PLANTILLAS_DE_ENTRENAMIENTOS' | translate"></app-page-header>
</ion-header>

<ion-content class="library-content" appScrollMemory="routines">
  <p class="page-hint">{{ 'ROUTINES.CREA_UNA_PLANTILLA_CON_SUS' | translate }}</p>

  <div class="library-search" *ngIf="!loading && cards.length > 0">
    <ion-icon name="search-outline" class="input-icon" aria-hidden="true"></ion-icon>
    <input
      type="search"
      class="input-field"
      [attr.aria-label]="'ROUTINES.BUSCAR_PLANTILLAS' | translate"
      [placeholder]="'ROUTINES.BUSCAR_PLANTILLAS_PLACEHOLDER' | translate"
      [(ngModel)]="search"
    />
  </div>

  <!-- Carga: la forma de la rejilla, no un spinner genérico. -->
  <div class="library-grid" *ngIf="loading">
    <div class="library-card-skeleton" *ngFor="let i of [1, 2, 3, 4, 5]"></div>
  </div>

  <!-- El alta es la primera tarjeta de la rejilla, como en Ejercicios: abre
       el builder vacío, que pide el nombre. -->
  <div class="library-grid" *ngIf="!loading">
    <button type="button" class="library-add-card" (click)="createTemplate()">
      <ion-icon name="add-outline" aria-hidden="true"></ion-icon>
      <span>{{ 'ROUTINES.ADD_CARD' | translate }}</span>
    </button>

    <div
      class="library-cell library-cell--two-actions"
      *ngFor="let card of filteredCards; trackBy: trackByTemplateId"
    >
      <button type="button" class="library-card" (click)="openTemplate(card.template)">
        <span class="library-card__top">
          <span class="library-card__name">{{ card.template.name }}</span>
        </span>

        <span class="template-preview" *ngIf="card.exerciseNames.length; else emptyTemplate">
          <span class="template-preview-item" *ngFor="let name of card.exerciseNames">{{ name | translateDb }}</span>
          <span class="template-preview-more" *ngIf="card.moreExercises">
            {{ 'ROUTINES.Y_N_MAS' | translate: { n: card.moreExercises } }}
          </span>
        </span>
        <ng-template #emptyTemplate>
          <span class="template-preview template-preview--empty">{{ 'ROUTINES.SIN_EJERCICIOS_TODAVIA' | translate }}</span>
        </ng-template>

        <span class="template-equipment" *ngIf="card.equipment.length">
          <ion-icon name="barbell-outline" aria-hidden="true"></ion-icon>
          <span><ng-container *ngFor="let item of card.equipment; let last = last">{{ item | translateDb }}<ng-container *ngIf="!last"> · </ng-container></ng-container></span>
        </span>

        <span class="library-card__description" *ngIf="card.template.description">{{ card.template.description }}</span>

        <span class="library-card__tags" *ngIf="card.template.tags?.length">
          <span class="library-card__tag" *ngFor="let tag of card.template.tags">{{ tag }}</span>
        </span>

        <span class="library-card__meta">
          <span><strong>{{ card.exerciseCount }}</strong> {{ (card.exerciseCount === 1 ? 'TRAINER_COMMON.EXERCISE_LOWER' : 'TRAINER_COMMON.EXERCISES_LOWER') | translate }}</span>
          <span><strong>{{ card.setCount }}</strong> {{ 'ROUTINES.SERIES' | translate }}</span>
          <span *ngIf="card.minutes">≈ <strong>{{ card.minutes }}</strong> min</span>
        </span>
      </button>

      <div class="library-card__actions">
        <button
          type="button"
          class="corner-button"
          [disabled]="isDuplicating"
          (click)="duplicateTemplate(card.template, $event)"
          [title]="'TRAINER_COMMON.DUPLICATE' | translate"
          [attr.aria-label]="('TRAINER_COMMON.DUPLICATE' | translate) + ': ' + card.template.name"
        >
          <ion-icon name="copy-outline" aria-hidden="true"></ion-icon>
        </button>
        <button
          type="button"
          class="corner-button corner-button--danger"
          (click)="confirmDelete(card.template, $event)"
          [title]="'TRAINER_COMMON.ERASE' | translate"
          [attr.aria-label]="('TRAINER_COMMON.ERASE' | translate) + ': ' + card.template.name"
        >
          <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="state-message" *ngIf="!loading && cards.length === 0">
    <ion-icon name="albums-outline" aria-hidden="true"></ion-icon>
    <h2>{{ 'ROUTINES.TODAVIA_NO_TIENES_PLANTILLAS' | translate }}</h2>
    <p>{{ 'ROUTINES.CREA_LA_PRIMERA_HINT' | translate }}</p>
    <p class="state-tip">
      <ion-icon name="bulb-outline" aria-hidden="true"></ion-icon>
      {{ 'ROUTINES.TIP_GUARDAR_DESDE_PLANIFICADOR' | translate }}
    </p>
  </div>

  <div class="state-message state-message--compact" *ngIf="!loading && cards.length > 0 && filteredCards.length === 0">
    <h2>{{ 'ROUTINES.NINGUNA_PLANTILLA_COINCIDE' | translate }}</h2>
    <button type="button" class="text-action" (click)="clearFilters()">{{ 'ROUTINES.QUITAR_FILTROS' | translate }}</button>
  </div>
</ion-content>
