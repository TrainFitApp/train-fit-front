<ion-header class="ion-no-border">
  <div class="tf-page-header">
    <div class="tf-page-header__content">
      <div class="tf-page-header__back-section">
        <ion-menu-button class="tf-page-header__back-button" aria-label="Abrir menú de navegación"></ion-menu-button>
      </div>
      <div class="tf-page-header__title-section">
        <h1 class="tf-page-header__title">Biblioteca</h1>
      </div>
      <div class="tf-page-header__actions"></div>
    </div>
  </div>
</ion-header>

<ion-content class="templates-content">
  <p class="page-hint">Todo lo que preparas para dárselo a un cliente: entrenamientos, rutinas, dietas e intercambios.</p>

  <app-category-grid [categories]="categories"></app-category-grid>

  <h2 class="section-heading">Recientes</h2>

  <!-- En escritorio, cada tipo es su propia columna en una grid (auto-fit:
       una columna sin datos ni skeleton no se renderiza, así que no reserva
       hueco); en móvil se apilan una debajo de otra. -->
  <div class="recent-columns">
    <section class="recent-column" *ngIf="loadingFullRoutineTemplates || fullRoutineTemplates.length">
      <div class="recent-column-header">
        <h3 class="recent-column-title">Rutinas</h3>
        <a class="recent-column-link" routerLink="/tabs/routine-templates">Ver todas</a>
      </div>

      <div class="recent-skeleton" *ngIf="loadingFullRoutineTemplates">
        <div class="skeleton-block recent-row-skeleton" *ngFor="let i of [1, 2, 3]"></div>
      </div>

      <div class="recent-list" *ngIf="!loadingFullRoutineTemplates">
        <button
          type="button"
          class="recent-row"
          *ngFor="let template of fullRoutineTemplates; trackBy: trackByFullRoutineTemplateId"
          (click)="openFullRoutineTemplate(template)"
        >
          <div class="recent-row-info">
            <span class="recent-row-name">{{ template.name }}</span>
            <span class="recent-row-meta">{{ fullRoutineTemplateMeta(template) }}</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="recent-row-chevron"></ion-icon>
        </button>
      </div>
    </section>

    <section class="recent-column" *ngIf="loadingRoutineTemplates || routineTemplates.length">
      <div class="recent-column-header">
        <h3 class="recent-column-title">Entrenamientos</h3>
        <a class="recent-column-link" routerLink="/tabs/routines">Ver todas</a>
      </div>

      <div class="recent-skeleton" *ngIf="loadingRoutineTemplates">
        <div class="skeleton-block recent-row-skeleton" *ngFor="let i of [1, 2, 3]"></div>
      </div>

      <div class="recent-list" *ngIf="!loadingRoutineTemplates">
        <button type="button" class="recent-row" *ngFor="let rt of routineTemplates" (click)="openTemplate(rt)">
          <div class="recent-row-info">
            <span class="recent-row-name">{{ rt.name }}</span>
            <span class="recent-row-meta">{{ exerciseCount(rt) }} ejercicios</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="recent-row-chevron"></ion-icon>
        </button>
      </div>
    </section>

    <section class="recent-column" *ngIf="loadingDietTemplates || dietTemplates.length">
      <div class="recent-column-header">
        <h3 class="recent-column-title">Dietas</h3>
        <a class="recent-column-link" routerLink="/tabs/diet-templates">Ver todas</a>
      </div>

      <div class="recent-skeleton" *ngIf="loadingDietTemplates">
        <div class="skeleton-block recent-row-skeleton" *ngFor="let i of [1, 2, 3]"></div>
      </div>

      <div class="recent-list" *ngIf="!loadingDietTemplates">
        <button type="button" class="recent-row" *ngFor="let dt of dietTemplates" (click)="openDietTemplate(dt)">
          <div class="recent-row-info">
            <span class="recent-row-name">{{ dt.name }}</span>
            <span class="recent-row-meta">{{ dietTemplateMeta(dt) }}</span>
          </div>
          <ion-icon name="chevron-forward-outline" class="recent-row-chevron"></ion-icon>
        </button>
      </div>
    </section>

  </div>

  <p
    class="empty-hint"
    *ngIf="
      !loadingRoutineTemplates && !loadingDietTemplates && !loadingFullRoutineTemplates &&
      !routineTemplates.length && !dietTemplates.length && !fullRoutineTemplates.length
    "
  >
    Todavía no has creado nada. Empieza desde cualquiera de las categorías de arriba.
  </p>
</ion-content>
