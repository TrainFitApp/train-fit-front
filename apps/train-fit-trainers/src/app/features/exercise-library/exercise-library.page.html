<!-- Sin cabecera de página: "Volver" va a la izquierda del buscador y el alta
     es la primera tarjeta de la lista (ver app-search-exercises). -->
<app-search-exercises
  *ngIf="listVisible"
  mode="library"
  (back)="navigation.back()"
  (create)="openExerciseForm()"
  (exerciseSelected)="openExerciseDetail($event)"
></app-search-exercises>
