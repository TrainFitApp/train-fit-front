<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú de navegación"></ion-menu-button>
    </ion-buttons>
    <ion-title>Biblioteca de ejercicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="exercise-library-content">
  <div class="library-page">
    <p class="library-hint">Consulta el catálogo completo de ejercicios sin entrar en una rutina.</p>

    <div class="search-row">
      <div class="input-wrapper">
        <ion-icon name="search-outline" class="input-icon"></ion-icon>
        <input
          type="text"
          class="input-field"
          placeholder="Buscar por nombre"
          [ngModel]="searchFilterGroupExercises.search"
          (ngModelChange)="onSearchInput($event)"
        />
      </div>
      <button type="button" class="filter-button" (click)="openFilterModal()">
        <ion-icon name="options-outline"></ion-icon>
      </button>
    </div>

    <div class="library-loading" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <div class="library-empty" *ngIf="!loading && exercises.length === 0">
      <ion-icon name="barbell-outline"></ion-icon>
      <p>Ningún ejercicio coincide con la búsqueda.</p>
    </div>

    <div class="exercise-grid" *ngIf="!loading && exercises.length > 0">
      <div
        class="exercise-card"
        *ngFor="let exercise of exercises; trackBy: trackByExerciseId"
        (click)="openExerciseDetail(exercise)"
      >
        <div class="exercise-card-header">
          <span class="exercise-name">{{ exercise.name }}</span>
          <span class="exercise-type" *ngIf="exercise.isCardio">Cardio</span>
          <span class="exercise-type" *ngIf="exercise.isIsometric">Isométrico</span>
        </div>
        <p class="exercise-muscle-preview" *ngIf="muscleGroupsPreview(exercise)">
          {{ muscleGroupsPreview(exercise) }}
        </p>
      </div>
    </div>
  </div>

  <ion-infinite-scroll (ionInfinite)="loadMore($event)" *ngIf="!loading && exercises.length > 0">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
