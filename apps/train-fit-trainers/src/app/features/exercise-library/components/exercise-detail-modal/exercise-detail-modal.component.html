<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ exercise?.name }}</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="isOwnExercise" (click)="requestEdit()" aria-label="Editar ejercicio">
        <ion-icon name="create-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button
        *ngIf="isOwnExercise"
        color="danger"
        (click)="requestDelete()"
        aria-label="Eliminar ejercicio"
      >
        <ion-icon name="trash-bin-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="close()" aria-label="Cerrar">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="exercise-detail-content">
  <div class="type-badge">{{ exerciseTypeLabel }}</div>

  <div class="video-wrapper" *ngIf="videoEmbedSrcSafe">
    <iframe
      [src]="videoEmbedSrcSafe"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>

  <p class="exercise-description" *ngIf="exercise?.description">{{ exercise.description }}</p>

  <div class="taxonomy-section" *ngIf="muscleRoles.length; else legacyMuscles">
    <h3>Músculos</h3>
    <div class="muscle-role-row" *ngFor="let row of muscleRoles">
      <span class="muscle-role-label muscle-role-label--{{ row.role }}">{{ row.label }}</span>
      <div class="chip-row">
        <span class="chip muscle-chip muscle-chip--{{ row.role }}" *ngFor="let m of row.muscles">
          <ng-container *ngIf="m.group">{{ m.group | translateDb }} · </ng-container>{{ m.label | translateDb }}
        </span>
      </div>
    </div>
  </div>
  <ng-template #legacyMuscles>
    <div class="taxonomy-section" *ngIf="muscleGroups.length">
      <h3>Grupos musculares</h3>
      <div class="chip-row">
        <span class="chip" *ngFor="let m of muscleGroups">{{ m }}</span>
      </div>
    </div>
  </ng-template>

  <div class="taxonomy-section" *ngIf="categories.length">
    <h3>Categorías</h3>
    <div class="chip-row">
      <span class="chip" *ngFor="let c of categories">{{ c }}</span>
    </div>
  </div>

  <div class="taxonomy-section" *ngIf="exercise?.equipment?.length">
    <h3>Equipamiento</h3>
    <div class="chip-row">
      <span class="chip" *ngFor="let e of exercise.equipment">{{ e }}</span>
    </div>
  </div>
</ion-content>
