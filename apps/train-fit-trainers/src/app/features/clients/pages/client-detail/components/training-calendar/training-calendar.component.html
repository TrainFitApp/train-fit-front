<div class="training-calendar">
  <div class="training-calendar__header">
    <button type="button" class="training-calendar__nav-btn" aria-label="Mes anterior" (click)="previousMonth()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <span class="training-calendar__month-label">{{ monthLabel }}</span>
    <button type="button" class="training-calendar__nav-btn" aria-label="Mes siguiente" (click)="nextMonth()">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
  </div>

  <div class="training-calendar__presets">
    <button
      type="button"
      class="preset-btn"
      *ngFor="let preset of rangePresets"
      [class.is-active]="activePreset === preset"
      (click)="selectPresetRange(preset)"
    >
      {{ preset }}d
    </button>
    <span class="range-label" *ngIf="rangeStart && rangeEnd">{{ rangeStart }} → {{ rangeEnd }}</span>
  </div>

  <div class="training-calendar__weekdays">
    <span *ngFor="let label of weekdayLabels">{{ label }}</span>
  </div>

  <div class="training-calendar__grid" (mouseleave)="onGridMouseLeave()">
    <button
      type="button"
      class="training-calendar__cell"
      *ngFor="let cell of cells; trackBy: trackByCell"
      [class.is-blank]="!cell.date"
      [class.is-today]="!!cell.date && cell.date === todayIso"
      [class.has-session]="!!cell.completed"
      [class.is-projected-training]="cell.projected && !cell.projected.isPlannedRestDay"
      [class.is-projected-rest]="cell.projected?.isPlannedRestDay"
      [class.is-in-range]="isInRange(cell.date)"
      [class.is-range-endpoint]="cell.date === rangeStart || cell.date === rangeEnd"
      [disabled]="!cell.date"
      [style.--fill-opacity]="fillOpacity(cell)"
      [style.--split-color]="cell.projected?.splitId ? splitColorMap.get(cell.projected.splitId) : null"
      [title]="cellTitle(cell)"
      (click)="selectDay(cell)"
      (mouseenter)="onCellHover(cell)"
    >
      <!-- Barra fina de color por split — capa independiente del relleno de
           cumplimiento (--fill-opacity, verde): color = identidad/split,
           opacidad = resultado. Mismo recorte que .nutrition-calendar__phase-bar. -->
      <span class="training-calendar__split-bar" *ngIf="cell.projected?.splitId"></span>
      <span class="training-calendar__day-number" *ngIf="cell.dayNumber">{{ cell.dayNumber }}</span>
      <span class="training-calendar__monogram" *ngIf="cell.completed || cell.projected" [class.is-done]="cell.completed">{{
        monogram(cell)
      }}</span>
    </button>
  </div>

  <div class="training-calendar__legend">
    <span class="legend-item" *ngFor="let split of visibleSplitLegend">
      <span class="legend-swatch" [style.background]="split.color"></span>
      {{ split.label }}
    </span>
    <span class="legend-item" *ngIf="!visibleSplitLegend.length">
      <span class="legend-swatch legend-swatch--projected-training"></span>Entreno previsto
    </span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--projected-rest"></span>Descanso previsto</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--session"></span>Completado (más oscuro = más cumplimiento)</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--range"></span>Dentro del rango</span>
    <span class="legend-item"><span class="legend-swatch legend-swatch--endpoint"></span>Inicio y fin</span>
  </div>
</div>
