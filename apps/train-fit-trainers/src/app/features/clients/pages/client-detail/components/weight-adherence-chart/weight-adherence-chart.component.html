<div class="weight-chart">
  <div class="weight-chart__summary" *ngIf="hasData">
    <span class="weight-chart__summary-item" *ngIf="averageCompliance !== null">
      <span class="weight-chart__summary-dot weight-chart__summary-dot--adherence"></span>
      Cumplimiento medio
      <strong>{{ averageCompliance }}%</strong>
    </span>
    <span class="weight-chart__summary-item" *ngIf="weightDelta as delta">
      <span class="weight-chart__summary-dot weight-chart__summary-dot--weight"></span>
      Peso
      <strong>{{ delta.startKg }} kg → {{ delta.endKg }} kg</strong>
    </span>
  </div>

  <p class="empty-hint" *ngIf="!isLoading && !hasData">
    Sin cumplimiento ni pesajes registrados en este rango.
  </p>

  <div class="weight-chart__canvas-wrap" [class.is-loading]="isLoading">
    <canvas #chartCanvas></canvas>
  </div>

  <div class="weight-chart__legend">
    <span class="legend-item"><span class="legend-swatch legend-swatch--adherence"></span>Cumplimiento (% pautado)</span>
    <span class="legend-item" *ngIf="hasWeightData"><span class="legend-swatch legend-swatch--weight"></span>Peso</span>
    <span class="weight-chart__no-weight" *ngIf="!isLoading && hasData && !hasWeightData">
      Sin pesajes registrados en este rango.
    </span>
  </div>
</div>
