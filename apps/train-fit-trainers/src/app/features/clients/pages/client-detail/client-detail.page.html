      <ion-back-button defaultHref="/tabs/clients" text=""></ion-back-button>

    <ion-title>{{ name || 'Cliente' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="detail-content">

      Aquí verás la rutina, la nutrición y las notas de

  </div>
</ion-content>
