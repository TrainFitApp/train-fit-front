<ng-container *ngIf="results$ | async as d; else loadingOrEmpty">
  <div class="suggestion-grid">
    <button
      type="button"
      class="suggestion-card"
      *ngFor="let t of d.ranked; trackBy: trackById"
      [class.is-podium]="t.rank <= 3"
      [class.is-first]="t.rank === 1"
      [class.is-selected]="(selectedId$ | async) === t._id"
      (click)="pick(t)"
    >
      <div class="card-top">
        <span class="medal" *ngIf="medal(t.rank)">{{ medal(t.rank) }}</span>
        <span class="card-name">{{ t.name }}</span>
        <span class="verified-tag" *ngIf="t.verified">de fábrica</span>
      </div>
      <p class="card-lead" *ngIf="t.rank === 1">Sugerencia principal</p>
      <div class="card-macros">
        <span>{{ t.profile.kcal }} kcal <em>({{ deltaLabel(t.deltas.kcal) }})</em></span>
        <span>P {{ t.profile.protein }} <em>({{ deltaLabel(t.deltas.protein) }})</em></span>
        <span>C {{ t.profile.carbs }} <em>({{ deltaLabel(t.deltas.carbs) }})</em></span>
        <span>G {{ t.profile.fat }} <em>({{ deltaLabel(t.deltas.fat) }})</em></span>
      </div>
      <p class="card-note" *ngIf="t.basedOnDays > 1">media de los {{ t.basedOnDays }} días del ciclo</p>
      <div class="card-flags" *ngIf="t.effectiveSuitableFor?.length">
        <span *ngFor="let f of t.effectiveSuitableFor">{{ flagLabel(f) }}</span>
      </div>
    </button>
  </div>

  <p class="empty-hint" *ngIf="!d.ranked.length">
    No hay dietas que encajen con los filtros. Ajusta los parámetros a la derecha,
    o crea dietas base desde "Plantillas de dieta".
  </p>

  <div class="hidden-block" *ngIf="d.hidden.length">
    <button type="button" class="hidden-toggle" (click)="showHidden = !showHidden">
      {{ showHidden ? 'Ocultar' : (d.hidden.length + ' dietas ocultas por las restricciones') }}
    </button>
    <ul *ngIf="showHidden">
      <li *ngFor="let h of d.hidden">{{ h.name }} <em>— no marcada como {{ h.missingFlags.join(', ') }}</em></li>
    </ul>
  </div>
</ng-container>

<ng-template #loadingOrEmpty>
  <div class="list-skeleton" *ngIf="loading$ | async; else pickParams">
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
    <div class="skeleton-block"></div>
  </div>
  <ng-template #pickParams>
    <p class="empty-hint">Elige los parámetros en el panel de la derecha para ver las dietas sugeridas.</p>
  </ng-template>
</ng-template>
