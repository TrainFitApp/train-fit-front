<ion-header class="ion-no-border">
  <app-page-header [title]="'MEDIA.TRAINER.INBOX_TITLE' | translate"></app-page-header>
</ion-header>

<ion-content class="inbox-content">
  <div class="inbox">
    <p class="inbox-intro">{{ 'MEDIA.TRAINER.INBOX_INTRO' | translate }}</p>

    <!-- Aviso de caducidad: nadie debe descubrir que un vídeo ha desaparecido -->
    <button type="button" class="expiry-banner" *ngIf="expiringSoonCount" (click)="showExpiring()">
      <ion-icon name="time-outline" aria-hidden="true"></ion-icon>
      <span>
        <strong>{{ 'MEDIA.TRAINER.EXPIRING_BANNER' | translate: { count: expiringSoonCount } }}</strong>
        <span>{{ 'MEDIA.TRAINER.EXPIRING_BANNER_SUB' | translate }}</span>
      </span>
    </button>

    <div class="filters" role="tablist" [attr.aria-label]="'MEDIA.TRAINER.FILTER_LABEL' | translate">
      <button type="button" role="tab" [class.active]="filter === 'pending'" [attr.aria-selected]="filter === 'pending'" (click)="setFilter('pending')">
        {{ 'MEDIA.TRAINER.FILTER_PENDING' | translate }}<span class="count" *ngIf="pendingCount">{{ pendingCount }}</span>
      </button>
      <button type="button" role="tab" [class.active]="filter === 'reviewed'" [attr.aria-selected]="filter === 'reviewed'" (click)="setFilter('reviewed')">
        {{ 'MEDIA.TRAINER.FILTER_REVIEWED' | translate }}
      </button>
      <button type="button" role="tab" [class.active]="filter === 'all'" [attr.aria-selected]="filter === 'all'" (click)="setFilter('all')">
        {{ 'MEDIA.TRAINER.FILTER_ALL' | translate }}
      </button>
    </div>

    <div class="inbox-skeleton" *ngIf="state === 'loading'">
      <div class="skeleton-row" *ngFor="let i of [1, 2, 3]"></div>
    </div>

    <div class="inbox-state" *ngIf="state === 'error'">
      <ion-icon name="cloud-offline-outline" aria-hidden="true"></ion-icon>
      <p>{{ 'MEDIA.LOAD_ERROR' | translate }}</p>
      <button type="button" class="retry-button" (click)="load()">{{ 'MEDIA.RETRY' | translate }}</button>
    </div>

    <ng-container *ngIf="state === 'loaded'">
      <div class="inbox-state" *ngIf="!visible.length">
        <ion-icon name="videocam-outline" aria-hidden="true"></ion-icon>
        <p>{{ (filter === 'pending' ? 'MEDIA.TRAINER.INBOX_EMPTY_PENDING' : 'MEDIA.TRAINER.INBOX_EMPTY') | translate }}</p>
      </div>

      <div class="rows">
        <button type="button" class="row" *ngFor="let check of visible; trackBy: trackCheck" (click)="open(check)">
          <span class="row-thumb">
            <img *ngIf="check.video?.thumbUrl as thumb" [src]="thumb" alt="" />
            <ion-icon *ngIf="!check.video?.thumbUrl" name="videocam-outline" aria-hidden="true"></ion-icon>
            <span class="row-duration" *ngIf="check.video?.durationSec as seconds">{{ seconds | number: '1.0-0' }} s</span>
          </span>
          <span class="row-main">
            <strong class="row-client">{{ check.clientName }}</strong>
            <span class="row-exercise">{{ check.exerciseName | translateDb }}</span>
            <span class="row-meta">{{ dateLabel(check.date) }}</span>
          </span>
          <span class="row-side">
            <span class="status" [class.status--pending]="check.status === 'pending'">
              {{ (check.status === 'pending' ? 'MEDIA.STATUS_PENDING' : 'MEDIA.STATUS_REVIEWED') | translate }}
            </span>
            <span class="expiry" *ngIf="check.keep">
              <ion-icon name="bookmark" aria-hidden="true"></ion-icon>{{ 'MEDIA.TRAINER.KEPT' | translate }}
            </span>
            <span class="expiry" *ngIf="!check.keep && check.daysLeft != null" [class.expiry--soon]="check.expiringSoon">
              <ion-icon name="time-outline" aria-hidden="true"></ion-icon>{{ 'MEDIA.EXPIRES_IN' | translate: { days: check.daysLeft } }}
            </span>
          </span>
          <ion-icon class="row-chevron" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </ng-container>
  </div>
</ion-content>
